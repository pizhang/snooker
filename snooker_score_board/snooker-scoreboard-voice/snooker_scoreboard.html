        function voiceEscape(text) {
            return String(text).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        // Escaped alternation, sorted longest-first so "green ball" wins over "green"
        function voiceHasPhrase(haystack, phrases) {
            return phrases.some(phrase => haystack.indexOf(phrase) !== -1);
        }

        // The first number anywhere in a phrase, digits or words: "5 points" → 5,
        // "foul four and a red" → 4. Returns null when the phrase carries no number.
        function voiceAnyNumber(text) {
            const digit = text.match(/\d+/);
            if (digit) return parseInt(digit[0], 10);
            const tokens = text.split(/\s+/);
            for (let i = 0; i < tokens.length; i += 1) {
                const word = tokens[i];
                if (Object.prototype.hasOwnProperty.call(VOICE_NUM_WORDS, word)) return VOICE_NUM_WORDS[word];
            }
            return null;
        }

        function voiceZhNumber(text) {
            const digit = text.match(/\d+/);
            if (digit) return parseInt(digit[0], 10);
            const keys = Object.keys(VOICE_ZH_NUM);
            for (let i = 0; i < keys.length; i += 1) {
                if (text.indexOf(keys[i]) !== -1) return VOICE_ZH_NUM[keys[i]];
            }
            return null;
        }

        // A negated ball must never score ("not blue, yellow" pots only yellow). Exactly one
        // negated clause is removed: from the negation up to the first clause break after it, or
        // to the end of the utterance when there is no break. The break itself is kept, so a later
        // clause survives. Everything is matched against a space-padded copy, because the breaks
        // are written with their spaces (", ", " then ", " but ") and the raw text has only one.
        function voiceDropNegated(text, negations, clauseBreaks) {
            const alternatives = negations
                .slice()
                .sort((a, b) => b.length - a.length)
                .map(voiceEscape)
                .join('|');
            if (!alternatives) return text;

            const ascii = /^[\x20-\x7E]*$/.test(negations.join(' '));
            const boundary = ascii ? '\\b' : '';
            const match = new RegExp(`(?:${boundary}(?:${alternatives})${boundary})`, 'i').exec(text);
            if (!match) return text;

            const breaks = (clauseBreaks || [])
                .slice()
                .sort((a, b) => a.length - b.length); // earliest-ending break wins on a tie
            const from = match.index + match[0].length;
            const haystack = ` ${text} `;
            let end = text.length;
            breaks.forEach(word => {
                const at = haystack.indexOf(word, from);
                if (at === -1) return;
                // Map the position in the padded string back onto the original text
                const original = Math.max(0, Math.min(text.length, at - 1));
                if (original >= from && original < end) end = original;
            });

            const kept = end >= text.length ? '' : text.slice(end);
            return (text.slice(0, match.index) + ' ' + kept).replace(/\s+/g, ' ').trim();
        }

        function voiceNormalize(text) {
            return String(text == null ? '' : text)
                .toLowerCase()
                // Commas survive: voiceDropNegated treats ", " as a clause break, so
                // "not blue, yellow" keeps the yellow. Other punctuation becomes a space.
                .replace(/[!?;.]/g, ' ')
                .replace(/[-_/\\]+/g, ' ')
                .replace(/,+/g, ', ')
                .replace(/\s+/g, ' ')
                .replace(/\s*,\s*/g, ', ')
                .trim();
        }

        // A transcript becomes at most ONE intent. Everything unknown returns null and is
        // ignored, so background speech can never score.
        function parseVoiceCommand(transcript, langOverride) {
            const raw = String(transcript == null ? '' : transcript);
            // A Chinese transcript is parsed with the Chinese vocabulary even when the page is in
            // English: the script is a stronger signal than the UI language setting.
            const zhPack = langOverride === 'zh' || /[\u4e00-\u9fff]/.test(raw);
            const pack = VOICE_VOCAB[zhPack ? 'zh' : 'en'];
            let text = voiceNormalize(raw);
            if (!text) return null;

            if (zhPack) text = text.replace(/[\s,，。！？、；：]/g, '');
            const zhNumber = zhPack ? voiceZhNumber(text) : null;
            const actions = pack.action;

            // A pending confirmation owns the next utterance, and it is answered before any
            // negation stripping — otherwise a bare "no" would be stripped and lost. "yes" and
            // "no" must be the whole utterance here, so "no red" is still a command, not an answer.
            if (voicePending) {
                if (pack.yes.indexOf(text) !== -1 || actions.yes.indexOf(text) !== -1) {
                    const pending = voicePending;
                    voicePending = null;
                    return { kind: 'confirm', intent: pending };
                }
                if (pack.no.indexOf(text) !== -1 || actions.no.indexOf(text) !== -1) {
                    voicePending = null;
                    return { kind: 'cancel' };
                }
                voicePending = null;
            }

            // A negated word never scores: "not blue, yellow" leaves only yellow
            text = voiceDropNegated(text, pack.negations, pack.clauseBreaks);
            if (!text.trim()) return null;
            const padded = zhPack ? text : ` ${text} `;
            const has = phrases => voiceHasPhrase(padded, phrases);

            // 0. Help and status questions
            if (has(actions.help)) return { kind: 'help' };
            if (has(actions.who)) return { kind: 'whoIsAtTable' };

            // 1. Fouls — matched before any ball name, so "foul on the blue" can never score 5.
            //    A foul is always spoken ("foul", "foul five", "five away"). The numbered
            //    patterns are only consulted once the foul word has been seen: the Chinese
            //    pattern matches a bare "一分", which otherwise matched the 一 inside 新一局.
            const foulWord = has(actions.foul) || has(pack.foul);
            const foulPhraseRaw = foulWord
                ? (pack.foulPhrases.map(re => raw.toLowerCase().match(re)).find(Boolean) || null)
                : null;
            const penaltyShape = /^\s*(\d+|one|two|three|four|five|six|seven|eight|nine|ten)\s+(?:points?\s+)?away\b/.test(text);
            if (foulWord || penaltyShape) {
                const spokenFoul = (foulPhraseRaw && voiceAnyNumber(foulPhraseRaw[1])) ||
                    (penaltyShape && voiceAnyNumber(text)) || null;
                const pts = spokenFoul || zhNumber || 4;
                if (pts < 4 || pts > 7) {
                    return { kind: 'error', messageKey: 'voiceFoulRange' };
                }
                return { kind: 'foul', pts, redAlsoPotted: has(pack.andRed) };
            }

            // 2. Potting a red is ambiguous, so it is checked before any other colour
            const redMulti = pack.redAlternative.find(pair => has([pair[0]]));
            if (redMulti) return { kind: 'pot', value: 1, reds: redMulti[1] };
            if (zhPack && /两[颗个]?红/.test(text)) return { kind: 'pot', value: 1, reds: 2 };
            if (has(pack.redSingular)) return { kind: 'pot', value: 1, reds: 1 };

            const colored = [2, 3, 4, 5, 6, 7].find(value => has(pack.ball[value]));
            if (colored) return { kind: 'pot', value: colored, reds: 1 };

            // 3. Visit, history and match intents — checked before a bare number, because the
            //    Chinese numeral 一 inside 新一局 would otherwise be read as "1 point"
            if (has(actions.endVisit)) return { kind: 'endVisit' };
            if (has(actions.undo)) return { kind: 'undo' };
            if (has(actions.newFrame)) return { kind: 'newFrame', needsConfirm: true };
            if (has(actions.resetMatch)) return { kind: 'resetMatch', needsConfirm: true };
            if (has(actions.concede)) return { kind: 'concede', who: voiceFindPlayer(text, zhPack) };
            if (has(actions.language)) {
                if (has(['english', '英文'])) return { kind: 'setLanguage', lang: 'en' };
                return { kind: 'setLanguage', lang: 'zh' };
            }

            // 4. A bare number is the ball value: "5 points" is the blue
            const spokenNumber = zhNumber != null ? zhNumber : voiceAnyNumber(text);
            if (spokenNumber != null) {
                if (spokenNumber >= 2 && spokenNumber <= 7) return { kind: 'pot', value: spokenNumber, reds: 1 };
                if (spokenNumber === 1) return { kind: 'pot', value: 1, reds: 1 };
                return null;
            }

            // Unknown speech is ignored: it is never guessed into a scoring action
            return null;
        }

        // Which player an utterance names, if any: 'A', 'B' or null. It takes the transcript it
        // is asked about (never a global), so the parser stays a pure function. Alternatives are
        // matched as whole phrases inside the utterance (not token-by-token), so multi-word
        // names like "player a", "玩家a" and "alice" all work, and a name is never matched as a
        // fragment of another word.
        function voiceFindPlayer(text, zhPack) {
            const pack = zhPack ? VOICE_VOCAB.zh : VOICE_VOCAB.en;
            const normalized = voiceNormalize(text);
            const tokens = normalized.split(zhPack ? /[\s,，。；：]+/ : /\s+/).filter(Boolean);
            const haystack = ` ${normalized} `;
            // A name is matched on the token form first, then as a spaced phrase. Only in Chinese
            // (where the transcript is compacted and a name has no surrounding spaces) is a plain
            // substring accepted, so a Latin name can never match inside another word.
            const says = phrases => phrases.some(phrase => {
                const clean = voiceNormalize(phrase);
                if (!clean) return false;
                if (tokens.indexOf(clean) !== -1) return true;
                if (haystack.indexOf(` ${clean} `) !== -1) return true;
                return zhPack && normalized.indexOf(clean) !== -1;
            });

            const nameA = voiceNormalize(state.nameA);
            const nameB = voiceNormalize(state.nameB);
            const spokenA = !!nameA && says([nameA]);
            const spokenB = !!nameB && says([nameB]);

            if (spokenA && !spokenB) return 'A';
            if (spokenB && !spokenA) return 'B';
            if (spokenA && spokenB) return null; // genuinely ambiguous — never guess

            const labelA = says(pack.playerSelf);
            const labelB = says(pack.playerOther);

            if (labelA && !labelB) return 'A';
            if (labelB && !labelA) return 'B';
            return null;
        }

        // ---- dispatch: every branch below calls the existing guarded action ----
        function voicePotLabel(value, reds) {
            if (value === 1) return reds === 2 ? t('voiceTwoReds') : t('colors').red;
            return colorLabel(VALUE_TO_COLOR[value]);
        }

        function voiceNameOf(player) {
            return player === 'A' ? state.nameA : player === 'B' ? state.nameB : '';
        }

        function executeVoiceCommand(intent) {
            if (!intent) return false;
            const atTable = () => voiceNameOf(state.turn);

            switch (intent.kind) {
                case 'pot': {
                    if (state.frameOver || state.phase === 'over') return voiceSayError('voiceFrameOver');
                    // The same question addPoints() asks, so a refusal is reported instead of
                    // claiming a pot that never happened
                    const allowed = intent.value === 1
                        ? canPotReds(intent.reds)
                        : canPotColor(intent.value);
                    if (!allowed) return voiceSayError('voiceNotAllowed');
                    const before = state[state.turn];
                    addPoints(state.turn, intent.value, intent.reds);
                    if (state[state.turn] === before) return voiceSayError('voiceNotAllowed');
                    return voiceSay(t('voiceAppliedPot', voicePotLabel(intent.value, intent.reds), atTable()));
                }

                case 'endVisit':
                    if (!canTakeShot()) return voiceSayError('voiceFrameOver');
                    takeShot();
                    return voiceSay(t('voiceAppliedEndVisit', atTable()));

                case 'foul':
                    if (state.frameOver) return voiceSayError('voiceFrameOver');
                    applyFoul(intent.pts, intent.redAlsoPotted);
                    return voiceSay(t('voiceAppliedFoul', intent.pts, atTable()));

                case 'undo':
                    if (state.history.length === 0) return voiceSayError('voiceNothingToUndo');
                    undo();
                    return voiceSay(t('voiceAppliedUndo'));

                // Destructive intents are parked in `voicePending` so the next utterance can
                // answer "yes" / "no" out loud. A parked intent carries `confirmed`, which is how
                // the approved re-dispatch below knows to act instead of asking again.
                case 'newFrame':
                    if (!intent.confirmed
                        && !voiceAsk('voiceAskNewFrame', null, { kind: 'newFrame', confirmed: true })) {
                        return false;
                    }
                    voicePending = null;
                    newFrame();
                    return voiceSay(t('voiceAppliedNewFrame'));

                case 'resetMatch':
                    if (!intent.confirmed
                        && !voiceAsk('voiceAskResetMatch', null, { kind: 'resetMatch', confirmed: true })) {
                        return false;
                    }
                    voicePending = null;
                    resetMatch();
                    return voiceSay(t('voiceAppliedResetMatch'));

                case 'concede':
                    if (state.frameOver) return voiceSayError('voiceFrameOver');
                    if (!intent.who) return voiceSayError('voiceNeedConceder');
                    if (!intent.confirmed
                        && !voiceAsk('voiceAskConcede', voiceNameOf(intent.who),
                            { kind: 'concede', who: intent.who, confirmed: true })) {
                        return false;
                    }
                    voicePending = null;
                    concedeFrame(intent.who);
                    return voiceSay(t('voiceAppliedConcede'));

                case 'setLanguage':
                    setLanguage(intent.lang);
                    return voiceSay(t('voiceAppliedLanguage'));

                case 'whoIsAtTable':
                    return voiceSay(t('voiceWhoIsAtTable', atTable()));

                case 'help':
                    showVoiceHelp();
                    return voiceSay(t('voiceHelpTitle'));

                case 'cancel':
                    return voiceSay(t('voiceCancelled'));

                case 'confirm':
                    return executeVoiceCommand(intent.intent);

                case 'error':
                    return voiceSayError(intent.messageKey);

                default:
                    return false;
            }
        }

        // ---- confirmation gate: a spoken command never fires a destructive action silently ----
        //
        // A destructive command is parked in `voicePending` and the board asks. When voice is
        // live the microphone re-opens and the answer comes from the next utterance ("yes"/"no",
        // handled by the pending branch of parseVoiceCommand); when voice is off the same
        // question is asked on screen.
        //
        // Returns true ONLY when the action was approved, so a "waiting for an answer" outcome
        // never prints a cancellation over the question just posted.
        function voiceAsk(questionKey, who, parkedAction) {
            // Dismiss any question left over from an earlier command BEFORE parking this one:
            // its cancel callback clears voicePending, which would otherwise wipe the action we
            // are about to ask about.
            if (voiceConfirmInFlight) voiceConfirmInFlight(false);
            voicePending = parkedAction;
            const question = t(questionKey, who ? who : '');

            // The microphone is the answer channel whenever voice is armed. Do not require a
            // session to be open at this instant: the engine ends its session between utterances,
            // and the answer "yes" arrives after it has closed — requiring voiceListening here
            // sent the answer to the on-screen dialog instead of re-opening the microphone.
            if (voiceSupported && !voiceMuted && voiceArmed) {
                // Wait for the spoken answer; the microphone re-opens in voiceHandleEnd
                voiceAwaitAnswer = true;
                voiceSetChip('result', `${question} ${t('voiceNeedConfirm')}`);
                if (voiceConfirmInFlight) {
                    // A dialog was already open for something else — close it and keep waiting
                    voiceConfirmInFlight(false);
                }
                if (!voiceListening) startVoiceListening();
                return false;
            }

            // Voice is off. The overlay answers later, from a tap, so it runs the parked action
            // itself and reports false here; only the synchronous confirm() fallback returns true
            // for the caller to run.
            if (voiceConfirm(questionKey, who)) return true;
            // A dialog is on screen — the tap decides later. Nothing is pending for the caller.
            if (voiceConfirmInFlight) return false;
            // No overlay and the answer was no: drop the park so a later stray "yes" is not eaten
            voicePending = null;
            voiceSay(t('voiceCancelled'));
            return false;
        }

        // Runs the parked action once and clears the park, so a later stray "yes" cannot raise
        // the same question again.
        function voiceRunPending() {
            const parked = voicePending;
            voicePending = null;
            if (!parked) return false;
            return executeVoiceCommand(parked);
        }

        // On-screen / synchronous confirmation, used when the microphone cannot hear the answer.
        function voiceConfirm(questionKey, who) {
            const question = t(questionKey, who ? who : '');
            const prompt = `${question} ${t('voiceNeedConfirm')}`;

            try {
                const overlay = document.createElement('div');
                overlay.className = 'foul-overlay';
                overlay.innerHTML = `
                    <div class="foul-box">
                        <h2>${t('voice')}</h2>
                        <p>${question}</p>
                        <div class="foul-note">${t('voiceSayYesNo')}</div>
                        <div class="foul-actions">
                            <button class="btn btn-pass-confirm" id="voiceYesBtn">${t('yes')}</button>
                            <button class="btn btn-cancel" id="voiceNoBtn">${t('no')}</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(overlay);

                let answered = false;
                function finish(approved) {
                    if (answered) return false;
                    answered = true;
                    if (overlay.parentNode) document.body.removeChild(overlay);
                    voiceConfirmInFlight = null;
                    if (approved) {
                        voiceRunPending();
                    } else {
                        voicePending = null;
                        voiceSay(t('voiceCancelled'));
                    }
                    return approved;
                }

                const yesBtn = overlay.querySelector('#voiceYesBtn');
                const noBtn = overlay.querySelector('#voiceNoBtn');
                if (!yesBtn || !noBtn) {
                    // Never leave an inert modal behind
                    if (overlay.parentNode) document.body.removeChild(overlay);
                    throw new Error('voice confirm overlay is incomplete');
                }
                yesBtn.addEventListener('click', () => finish(true));
                noBtn.addEventListener('click', () => finish(false));
                overlay.addEventListener('click', (e) => {
                    if (e.target === overlay) finish(false);
                });

                // Only claim the in-flight slot once the overlay is really interactive
                voiceConfirmInFlight = finish;
                voiceSetChip('result', prompt);
                // The answer arrives later, from the tap. No speech synthesis, so the board can
                // never be heard by its own microphone.
                return false;
            } catch (e) {
                // No usable overlay: ask synchronously and keep the action parked for the caller
                return !!(typeof window !== 'undefined' && window.confirm && window.confirm(prompt));
            }
        }

        // ---- spoken status chip ----
        let voiceStatus = { key: 'voiceOff', text: '' };

        function voiceSetChip(cls, text) {
            voiceStatus = { key: null, text, cls };
            updateVoiceChip();
        }

        function voiceSay(text) {
            voiceStatus = { key: null, text, cls: 'result' };
            updateVoiceChip();
            voiceChime();
            return true;
        }

        function voiceSayError(key, ...args) {
            const text = t(key, ...args);
            voiceStatus = { key, text, cls: 'error' };
            updateVoiceChip();
            return false;
        }

        function voiceSayHeard(text) {
            voiceStatus = { key: null, text, cls: 'listening' };
            updateVoiceChip();
        }

        function voiceSayUnknown(text) {
            voiceStatus = { key: null, text: t('voiceUnknown', text), cls: 'error' };
            updateVoiceChip();
        }

        function localVoicePack() {
            return (I18N[lang] || I18N.en);
        }

        // Opened from a file, the page is an opaque origin: the microphone grant cannot stick, so
        // the browser re-asks. The chip says so, and the help sheet explains how to avoid it.
        function voiceFromFile() {
            return typeof location !== 'undefined' && location.protocol === 'file:';
        }

        function updateVoiceChip() {
            if (!voiceChip) return;
            const cls = [];
            // A keyed status follows the language; free text is shown as it was heard
            const statusText = voiceStatus.key ? t(voiceStatus.key) : voiceStatus.text;
            let text = statusText;
            if (!voiceSupported) {
                text = t('voiceUnsupported');
                cls.push('voice-error');
            } else if (voiceMuted) {
                text = voiceFromFile() ? localVoicePack().voiceFileHint : t('voiceOff');
                cls.push('voice-on');
            } else if (voiceListening) {
                text = statusText || t('voiceListening');
                cls.push('voice-listening');
            } else {
                // Armed but between recognition sessions (the restart gap)
                text = statusText || t('voiceOn');
                cls.push(voiceStatus.cls === 'error' ? 'voice-error'
                    : voiceStatus.cls === 'result' ? 'voice-result' : 'voice-on');
            }
            voiceChip.className = 'voice-chip ' + cls.join(' ');
            voiceChip.title = voiceFromFile() ? localVoicePack().voiceHelpFile : t('voiceToggleTitle');
            voiceTextEl.textContent = text;
        }

        // ---- Web Speech API wiring ----
        // Hands-free: one click arms the board, and it keeps re-opening the microphone after every
        // utterance until you click again (or press V). The browser's recogniser session is
        // inherently short and stops itself after an utterance or a stretch of silence, so staying
        // "listening" means restarting the session each time it ends — which is also why the
        // audible/visual microphone indicator stays on for the whole session rather than blinking
        // once per command.
        let recognition = null;
        let voiceArmed = false;      // the user wants the microphone live (hands-free mode)
        let voiceListening = false;  // a recognition session is open right now
        let voiceMuted = true;       // kept in step with !voiceArmed for the rest of the code
        let voiceSessionActive = false;
        let voiceLastTranscript = '';
        let voiceRestarts = 0;             // guard against a restart loop
        // A quiet room makes the engine end sessions constantly, so the guard is about avoiding a
        // tight start() loop, not about limiting normal use. A real utterance resets it, and the
        // back-off after silence keeps that loop slow.
        let voiceMaxRestarts = 3000;
        let voiceRestartDelay = 250;       // gap after an utterance (tests set 0)
        let voiceSilenceDelay = 600;       // gap after a silent session
        let voiceHeardSomething = false;   // did the last session produce an utterance?
        let voiceHandledIndex = -1;        // last processed result index in the current session
        let voiceLastExecuted = '';        // last dispatched transcript, to catch re-finalised audio

        // The recogniser accepts up to 5 guesses per utterance and knows our ~40 words, so a
        // near-miss ("yello", "browm", "blu") still lands on a legal command.
        const VOICE_MAX_ALTERNATIVES = 5;
        const VOICE_NEAR_MISS = 1;         // edit distance accepted for a single word
        let voiceLocalStepDelay = 150;     // pause between local capture steps (tests set 0)

        function voiceSpeechCtor() {
            return window.SpeechRecognition || window.webkitSpeechRecognition || null;
        }

        // Vocabulary bias would be the ideal accuracy fix, but Chrome documents that it ignores the
        // contents of a JSGF grammar, so attaching one buys nothing and can only add risk. The
        // accuracy work is done differently: several alternatives per utterance (below) plus the
        // near-miss matcher, which only ever snaps a word onto a word the board already knows.

        // Ask for the microphone while the click is still "fresh", then release the device so the
        // recogniser can open it. Browsers remember the answer per origin, so this is normally a
        // one-time prompt; keeping it here means the prompt never appears mid-listen.
        function voiceRequestMic() {
            const md = typeof navigator !== 'undefined' ? navigator.mediaDevices : null;
            if (!md || typeof md.getUserMedia !== 'function') return Promise.resolve(true);
            return md.getUserMedia({ audio: true }).then(stream => {
                try { stream.getTracks().forEach(track => track.stop()); } catch (e) {}
                return true;
            }).catch(() => false);
        }

        function voiceBuildRecognition() {
            const Ctor = voiceSpeechCtor();
            if (!Ctor) return null;
            const engine = new Ctor();
            engine.lang = VOICE_SR_LOCALE[lang] || VOICE_SR_LOCALE.en;
            // Continuous keeps one session open across several commands, which is both fewer
            // "stopped listening" gaps and fewer of Chrome's per-session start beeps. The engine
            // still ends the session after a stretch of silence; the restart loop covers that.
            engine.continuous = true;
            engine.interimResults = true;
            engine.maxAlternatives = VOICE_MAX_ALTERNATIVES;
            return engine;
        }

        function voiceHandleResult(event) {
            let interimText = '';

            for (let i = event.resultIndex; i < event.results.length; i += 1) {
                const result = event.results[i];
                if (!result || !result.isFinal) {
                    if (result) interimText += ` ${voiceResultText(result, 0)}`;
                    continue;
                }
                // Every final result in the event is a candidate command. The engine may report
                // the same result index more than once, so duplicates are filtered on the text
                // below rather than on the index — an index guard silently dropped every command
                // after the first one in a session.
                const picked = voiceBestTranscript(result);
                const spokenText = picked && picked.transcript ? picked.transcript : '';
                const key = spokenText.toLowerCase();
                // The engine re-finalising the same audio is one utterance, not two commands
                if (key && key === voiceLastExecuted) {
                    voiceHeardSomething = true;
                    voiceLastTranscript = spokenText;
                    updateVoiceChip();
                    continue;
                }
                if (spokenText) voiceLastExecuted = key;
                const intent = spokenText ? parseVoiceCommand(spokenText, lang) : null;
                voiceHeardSomething = true;
                voiceLastTranscript = spokenText;
                // When a lower-ranked guess won, show both so a wrong pick is obvious
                if (intent && picked.picked) {
                    const top = voiceResultText(result, 0);
                    voiceSay(t('voicePicked', spokenText, top));
                } else {
                    voiceSayHeard(spokenText);
                }
                voiceRouteTranscript(spokenText, intent);
            }

            if (interimText.trim()) {
                voiceHeardSomething = true;
                voiceLastTranscript = interimText.trim();
                voiceSayHeard(voiceLastTranscript);
            }
        }

        function voiceResultText(result, i) {
            const alt = result && result[i];
            return alt && alt.transcript ? String(alt.transcript).trim() : '';
        }

        // Pick the guess the board can actually use: the top one when it parses, otherwise the
        // first alternative that resolves to a real command (a near-miss is better than silence).
        //
        // Probing candidates must not disturb a parked confirmation, and parseVoiceCommand's
        // pending branch has side effects — so while something is pending, ranking is skipped
        // entirely and the transcript is handed to the normal path untouched.
        function voiceBestTranscript(result) {
            const candidates = [];
            for (let i = 0; i < VOICE_MAX_ALTERNATIVES; i += 1) {
                const text = voiceResultText(result, i);
                // The caller reads `.transcript`; building `.text` here silently discarded every
                // recognised utterance, which looked exactly like "it heard me but did nothing".
                if (text) candidates.push({ transcript: text, confidence: Number(result[i].confidence) || 0 });
            }
            if (!candidates.length) return { transcript: '', confidence: 0 };
            if (voicePending || candidates.length === 1) return candidates[0];

            if (candidates.some(c => parseVoiceCommand(c.transcript, lang))) return candidates[0];

            const relaxed = VOICE_VOCAB[lang === 'zh' ? 'zh' : 'en'];
            for (let i = 1; i < candidates.length; i += 1) {
                const near = voiceNearMiss(candidates[i].transcript, relaxed);
                if (near && parseVoiceCommand(near, lang)) {
                    return { transcript: near, confidence: candidates[i].confidence, picked: i };
                }
            }
            return candidates[0];
        }

        // Match each word against the command vocabulary, allowing one typo ("yello" → "yellow").
        // Only the word is replaced, and only by a word the board already knows, so an unknown
        // sentence is still ignored rather than guessed into a score.
        function voiceNearMiss(text, pack) {
            const words = [];
            Object.keys(pack.ball).forEach(value => pack.ball[value].forEach(w => words.push(w)));
            pack.action.endVisit.concat(pack.action.undo, pack.action.help, pack.action.who,
                pack.action.concede, pack.action.foul).forEach(w => words.push(w));
            pack.redAlternative.forEach(pair => words.push(pair[0]));

            let changed = false;
            const repaired = String(text).split(/\s+/).map(token => {
                if (token.length < 3) return token;
                const candidate = words.find(word => voiceCloseEnough(token, word));
                if (candidate && candidate !== token) {
                    changed = true;
                    return candidate;
                }
                return token;
            }).join(' ');
            if (changed) return repaired;

            // Chinese is unsegmented: the whole phrase is one token, so compare as a whole
            if (/[\u4e00-\u9fff]/.test(text)) {
                const word = words.find(candidate => voiceCloseEnough(text, candidate));
                if (word && word !== text) return word;
            }
            return null;
        }

        function voiceCloseEnough(a, b) {
            if (a === b) return true;
            if (Math.abs(a.length - b.length) > VOICE_NEAR_MISS) return false;
            if (a.length < 3 || b.length < 3) return false;
            return voiceEditDistance(a, b) <= VOICE_NEAR_MISS;
        }

        function voiceEditDistance(a, b) {
            const rows = a.length + 1;
            const cols = b.length + 1;
            let previous = new Array(cols);
            let current = new Array(cols);
            for (let j = 0; j < cols; j += 1) previous[j] = j;
            for (let i = 1; i < rows; i += 1) {
                current[0] = i;
                for (let j = 1; j < cols; j += 1) {
                    const cost = a[i - 1] === b[j - 1] ? 0 : 1;
                    current[j] = Math.min(
                        previous[j] + 1,
                        current[j - 1] + 1,
                        previous[j - 1] + cost
                    );
                }
                const swap = previous;
                previous = current;
                current = swap;
            }
            return previous[cols - 1];
        }

        // "I heard X, and it means Y" — the chip needs both halves, or a transcript that the board
        // cannot turn into an action looks identical to one that never arrived.
        function voiceIntentKey(intent) {
            if (!intent || !intent.kind) return 'voiceIntentUnknown';
            const map = {
                pot: 'voiceIntentPot',
                endVisit: 'voiceIntentEndVisit',
                foul: 'voiceIntentFoul',
                undo: 'voiceIntentUndo',
                newFrame: 'voiceIntentNewFrame',
                resetMatch: 'voiceIntentResetMatch',
                concede: 'voiceIntentConcede',
                help: 'voiceIntentHelp',
                whoIsAtTable: 'voiceIntentWho',
                setLanguage: 'voiceIntentLanguage',
                cancel: 'voiceIntentCancel',
                confirm: 'voiceIntentConfirm',
                error: 'voiceIntentUnknown',
            };
            return map[intent.kind] || 'voiceIntentUnknown';
        }

        function voiceRouteTranscript(transcript, preParsedIntent) {
            voiceLastTranscript = transcript;
            // A new utterance is the answer to a pending prompt, or it replaces it. Either way
            // any open question dialog is now stale, so close it before dispatching.
            if (voiceConfirmInFlight) voiceConfirmInFlight(false);
            const intent = preParsedIntent || parseVoiceCommand(transcript, lang);
            if (!intent) {
                // Say what was heard AND that it mapped to nothing: this is the difference between
                // a recognition problem and a vocabulary problem.
                voiceSayError('voiceUnknownFull', transcript);
                return;
            }
            voiceIntentLast = t(voiceIntentKey(intent));
            executeVoiceCommand(intent);
        }

        let voiceIntentLast = '';

        function startVoiceListening() {
            if (!recognition) {
                recognition = voiceBuildRecognition();
                if (recognition) {
                    recognition.onresult = voiceHandleResult;
                    recognition.onend = voiceHandleEnd;
                    recognition.onerror = (event) => {
                        const code = event && event.error ? event.error : '';
                        voiceListening = false;
                        voiceSessionActive = false;
                        // Silence and an interrupted session are normal: back off a little further
                        if (code === 'no-speech' || code === 'aborted') {
                            updateVoiceChip();
                            if (voiceArmed) voiceScheduleRestart(voiceSilenceDelay);
                            return;
                        }
                        if (code === 'not-allowed' || code === 'service-not-allowed') {
                            voiceArmed = false;
                            voiceMuted = true;
                            voiceStatus = { key: 'voiceDenied', text: '', cls: 'error' };
                            updateVoiceChip();
                            return;
                        }
                        voiceSayError('voiceError');
                        if (voiceArmed) voiceScheduleRestart();
                    };
                }
            }
            if (!recognition || !voiceArmed) return;
            if (voiceConfirmInFlight) return; // waiting on an on-screen answer, keep it calm

            voiceListening = true;
            voiceSessionActive = true;
            voiceHandledIndex = -1;
            voiceLastExecuted = '';
            voiceLastTranscript = '';
            voiceHeardSomething = false;
            updateVoiceChip();
            try {
                recognition.lang = VOICE_SR_LOCALE[lang] || VOICE_SR_LOCALE.en;
                recognition.start();
            } catch (e) {
                // start() throws when a session is already running: abandon and let onend decide
                voiceListening = false;
                if (voiceArmed) voiceScheduleRestart();
                else voiceSayError('voiceError');
            }
        }

        // Re-open the microphone shortly after the engine closes its session. Hands-free mode
        // lives or dies on this: the Web Speech API has no real continuous mode, so "always
        // listening" is a restart loop with a small delay to avoid hammering start().
        let voiceRestartTimer = null;

        function voiceScheduleRestart(delay) {
            if (!voiceArmed || voiceConfirmInFlight) return;
            if (voiceRestarts >= voiceMaxRestarts) {
                voiceArmed = false;
                voiceMuted = true;
                voiceStatus = { key: null, text: t('voiceRestartLimit'), cls: 'error' };
                updateVoiceChip();
                return;
            }
            voiceRestarts += 1;
            if (voiceRestartTimer) return;
            voiceRestartTimer = setTimeout(() => {
                voiceRestartTimer = null;
                if (!voiceArmed) return;
                startVoiceListening();
            }, delay == null ? voiceRestartDelay : delay);
        }

        // The engine stops itself after an utterance or a stretch of silence.
        function voiceHandleEnd() {
            if (!voiceSessionActive) return;
            voiceSessionActive = false;
            voiceListening = false;
            if (voiceHeardSomething) voiceRestarts = 0; // real speech resets the guard
            if (!voiceStatus.text && !voiceStatus.key) voiceStatus = { key: null, text: '', cls: null };
            // Do NOT treat this as answered: the flag means "waiting for the spoken yes/no"
            updateVoiceChip();
            if (voiceAwaitAnswer) {
                if (voiceArmed && voiceSupported) startVoiceListening();
                return;
            }
            if (voiceArmed) voiceScheduleRestart(voiceHeardSomething ? voiceRestartDelay : voiceSilenceDelay);
        }

        function stopVoiceListening() {
            if (voiceRestartTimer) {
                clearTimeout(voiceRestartTimer);
                voiceRestartTimer = null;
            }
            voiceListening = false;
            voiceSessionActive = false;
            if (!recognition) return;
            try { recognition.abort(); } catch (e) {}
            updateVoiceChip();
        }

        // Arm/disarm hands-free mode. One click on, one click off — no second click per command.
        function toggleVoiceMute() {
            if (!voiceSupported) {
                voiceArmed = false;
                voiceMuted = true;
                voiceStatus = { key: 'voiceUnsupported', text: '', cls: 'error' };
                updateVoiceChip();
                return;
            }
            if (voiceArmed) {
                voiceArmed = false;
                voiceMuted = true;
                stopVoiceListening();
                voiceStatus = { key: null, text: '', cls: null };
                updateVoiceChip();
                return;
            }
            voiceStatus = { key: null, text: '', cls: null };
            updateVoiceChip();
            voiceRequestMic().then(allowed => {
                if (!allowed) {
                    voiceArmed = false;
                    voiceMuted = true;
                    voiceStatus = { key: 'voiceDenied', text: '', cls: 'error' };
                    updateVoiceChip();
                    return;
                }
                voiceArmed = true;
                voiceMuted = false;
                voiceRestarts = 0;
                startVoiceListening();
            });
        }

        // ---- spoken confirmation ("foul five") + optional chime (no speech synthesis, so the
        //      microphone can never hear the board talk back over the players) ----
        let audioCtx = null;

        function voiceChime() {
            try {
                const Ctor = window.AudioContext || window.webkitAudioContext;
                if (!Ctor) return;
                if (!audioCtx) audioCtx = new Ctor();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = 880;
                gain.gain.value = 0.05;
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } catch (e) {}
        }

        // ---- voice help sheet ----
        function showVoiceHelp() {
            const overlay = document.createElement('div');
            overlay.className = 'foul-overlay';
            const rows = VOICE_HELP_KEYS.map(pair => `
                <div class="voice-help-row">
                    <code>${t(pair[0])}</code>
                    <span>${t(pair[1])}</span>
                </div>
            `).join('');

            const engineNote = voiceSupported
                ? t('voiceHelpBrowserOk')
                : t('voiceHelpBrowserMissing');
            overlay.innerHTML = `
                <div class="foul-box">
                    <h2>${t('voiceHelpTitle')}</h2>
                    <p>${t('voiceHelpHint')}</p>
                    <div class="foul-note" style="text-align:left">${t('voiceHelpHint2')}</div>
                    <div class="voice-help-grid">
                        ${rows}
                        <div class="voice-help-row">
                            <code>${t('voiceHelpNoteLabel')}</code>
                            <span>${engineNote}</span>
                        </div>
                        <div class="voice-set-note" style="text-align:left" id="voiceDiag"></div>
                    </div>
                    <div class="foul-actions">
                        <button class="btn btn-cancel" id="voiceHelpClose">${t('voiceHelpClose')}</button>
                    </div>
                    <div class="foul-note" style="margin-top:10px">${t('voiceHelpMic')}</div>
                    ${voiceFromFile() ? `<div class="foul-note" style="margin-top:6px">${localVoicePack().voiceHelpFile}</div>` : ''}
                </div>
            `;
            document.body.appendChild(overlay);

            const close = () => {
                if (overlay.parentNode) document.body.removeChild(overlay);
            };
            const closeBtn = overlay.querySelector('#voiceHelpClose');
            if (closeBtn) closeBtn.addEventListener('click', close);
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) close();
            });
        }

        // ---- bind (safe when the chip is missing, e.g. an older saved page) ----
        function bindVoice() {
            updateVoiceChip();
            if (!voiceChip) return;
            voiceChip.addEventListener('click', () => {
                // One click arms hands-free listening, the next one stops it
                toggleVoiceMute();
            });
            // A longer press (or right click) opens the phrase sheet
            voiceChip.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                showVoiceHelp();
            });
        }

        // ===== VOICE COMMANDS END =====

        // ============================================================
        // LOAD / INIT
        // ============================================================

        function loadState() {
            try {
                const saved = localStorage.getItem('snooker_state_v2');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (parsed && typeof parsed.A === 'number' && typeof parsed.B === 'number' && parsed.turn) {
                        Object.assign(state, parsed);
                        render();
                        return true;
                    }
                }
            } catch (e) {}
            return false;
        }

        // ============================================================
        // LANGUAGE
        // ============================================================

        function readStoredLanguage() {
            try {
                const saved = localStorage.getItem(LANG_KEY);
                if (saved && I18N[saved]) return saved;
            } catch (e) {}
            // Fall back to the browser language
            return (navigator.language || '').toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en';
        }

        function applyStaticText() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                el.textContent = t(el.getAttribute('data-i18n'));
            });
            document.querySelectorAll('[data-i18n-title]').forEach(el => {
                el.title = t(el.getAttribute('data-i18n-title'));
            });
            document.title = t('docTitle');
            document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
            langChips.forEach(chip => chip.classList.toggle('active', chip.getAttribute('data-lang') === lang));
        }

        function setLanguage(nextLang) {
            if (!I18N[nextLang] || nextLang === lang) return;
            lang = nextLang;
            try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
            localizeDefaultNames();
            applyStaticText();
            render();
        }

        function bindEvents() {
            if (typeof document.querySelectorAll !== 'function') return;
            // Button clicks
            document.querySelectorAll('.btn-grid .btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const player = btn.getAttribute('data-player');
                    const value = btn.getAttribute('data-value');
                    if (!player || !value) return;
                    addPoints(player, value, parseInt(btn.getAttribute('data-reds') || '1', 10));
                });
            });

            // Middle controls (they apply to the player at the table)
            shotTakenBtn.addEventListener('click', takeShot);
            foulBtn.addEventListener('click', () => showFoulDialog(state.turn));
            startABtn.addEventListener('click', () => selectStarter('A'));
            startBBtn.addEventListener('click', () => selectStarter('B'));

            // Action buttons
            undoBtn.addEventListener('click', undo);
            concedeBtn.addEventListener('click', showConcedeDialog);
            resetBtn.addEventListener('click', newFrame);
            resetMatchBtn.addEventListener('click', resetMatch);

            // Language switch
            langChips.forEach(chip => {
                chip.addEventListener('click', () => setLanguage(chip.getAttribute('data-lang')));
            });

            // Name edit
            nameAEl.addEventListener('click', () => startNameEdit('A'));
            nameBEl.addEventListener('click', () => startNameEdit('B'));

            // Voice control
            bindVoice();

            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.key === 'u' || e.key === 'U') undo();
                if (e.key === 'n' || e.key === 'N') newFrame();
                if (e.key === 'r' || e.key === 'R') resetMatch();
                if (e.key === 's' || e.key === 'S') {
                    if (canTakeShot()) takeShot();
                }
                if (e.key === 'v' || e.key === 'V') toggleVoiceMute();
                if (e.key === '?') showVoiceHelp();
                if (e.key === '1') setup147Test();
                if (e.key === '2') setupLastRedTest();
                if (e.key === '3') quickRedBlack();
                if (e.key === '4') quickPotBlack();
            });
        }

        function init() {
            lang = readStoredLanguage();
            const loaded = loadState();
            if (!loaded) resetState();
            localizeDefaultNames();
            applyStaticText();
            render();
            bindEvents();
            console.log('🎱 Snooker Scorer Pro loaded!');
            console.log('📋 Phase: ' + state.phase + ', Reds: ' + state.reds, '· Lang: ' + lang);
            console.log('⌨️ Shortcuts: 1=Test147, 2=TestLastRed, 3=QuickRed+Black, 4=PotBlack, S=ShotTaken, V=Voice, ?=VoiceHelp');
            if (!voiceSupported) console.log('🎙️ Voice needs Chrome or Edge — the 🎙️ chip stays off.');
        }

        init();
    })();
</script>
</body>
</html>
