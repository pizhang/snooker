<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Snooker Scoreboard</title>
    <style>
        * { box-sizing: border-box; user-select: none; font-family: 'Segoe UI', Roboto, system-ui, sans-serif; }
        body {
            margin: 0;
            min-height: 100vh;
            background: #0a1f2e;
            background: radial-gradient(circle at 20% 30%, #1a3a4a, #071016);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 8px;
            touch-action: manipulation;
        }
        .scoreboard {
            max-width: 1100px;
            width: 100%;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(4px);
            border-radius: 64px 64px 48px 48px;
            padding: 10px 22px 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 0 2px #b8860b55, 0 0 0 6px #2a1f0e;
            border: 1px solid #d4af37;
        }
        h1 {
            text-align: center;
            margin: 0 0 2px 0;
            font-weight: 300;
            letter-spacing: 6px;
            color: #d4af37;
            text-shadow: 0 0 10px #b8860b88, 0 2px 0 #5a3e0e;
            font-size: 1.8rem;
        }

        .ball-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 10px;
            background: #0b1a22;
            padding: 6px 16px;
            border-radius: 60px;
            border: 2px solid #2a4a5a;
            min-height: 48px;
        }
        .ball-status .label { color: #6a8a96; font-size: 0.85rem; font-weight: 600; letter-spacing: 1px; margin-right: 4px; }
        .red-counter {
            font-size: 1.4rem;
            font-weight: 700;
            color: #ff6b6b;
            padding: 0 6px;
            letter-spacing: 1px;
            text-shadow: 0 0 20px #ff6b6b44;
            display: inline-flex;
            align-items: center;
            gap: 2px;
        }
        .red-counter .number { font-size: 1.8rem; color: #ff8888; min-width: 24px; text-align: center; }
        .red-counter.all-potted { color: #ffd966; text-shadow: 0 0 30px #ffd96666; }
        .red-counter.all-potted .number { color: #ffdd77; }

        .color-balls {
            display: flex;
            gap: 4px;
            align-items: center;
            padding-left: 6px;
            border-left: 2px solid #2a4a5a;
        }
        .color-ball {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid #4a6a7a;
            transition: all 0.3s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            flex-shrink: 0;
            position: relative;
        }
        .color-ball.potted { opacity: 0.2; transform: scale(0.7); border-color: #1a2a2a; filter: grayscale(1); }
        .color-ball.next-color {
            border-color: #ffd966;
            box-shadow: 0 0 16px #ffd96666, 0 0 4px #ffd966;
            animation: pulse-gold 1.2s ease-in-out infinite;
        }
        .color-ball.available-after-last-red {
            border-color: #ff6b6b;
            box-shadow: 0 0 16px #ff6b6b66, 0 0 4px #ff6b6b;
            animation: pulse-red 0.8s ease-in-out infinite;
        }
        @keyframes pulse-gold {
            0%, 100% { box-shadow: 0 0 8px #ffd96644, 0 0 2px #ffd966; }
            50% { box-shadow: 0 0 24px #ffd96688, 0 0 8px #ffd966; }
        }
        @keyframes pulse-red {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.05); }
        }
        .color-ball.yellow { background: radial-gradient(circle at 35% 35%, #ffe066, #c9a82b); }
        .color-ball.green { background: radial-gradient(circle at 35% 35%, #66dd88, #2e7d4e); }
        .color-ball.brown { background: radial-gradient(circle at 35% 35%, #b8864a, #7a4d2b); }
        .color-ball.blue { background: radial-gradient(circle at 35% 35%, #66aadd, #2a6b9c); }
        .color-ball.pink { background: radial-gradient(circle at 35% 35%, #ff77aa, #b8477a); }
        /* Pink has no circle emoji, so it is drawn as a dot sized like the other ball emoji:
           0.98em across, with its bottom 0.13em below the baseline */
        .ball-dot {
            display: inline-block;
            width: 0.98em;
            height: 0.98em;
            border-radius: 50%;
            vertical-align: -0.13em;
        }
        .ball-dot.pink { background: radial-gradient(circle at 35% 35%, #ffd0e2, #ff77aa); }
        .color-ball.black { background: radial-gradient(circle at 35% 35%, #888, #1a1a1a); border-color: #5a5a5a; }

        .frame-over-badge {
            display: none;
            background: #ffd966;
            color: #0a1f2e;
            font-weight: 700;
            font-size: 0.9rem;
            padding: 2px 14px;
            border-radius: 30px;
            letter-spacing: 1px;
            margin-left: 6px;
        }
        .frame-over-badge.active { display: inline-block; animation: pulse-gold 1s ease-in-out infinite; }

        .phase-indicator {
            font-size: 0.75rem;
            color: #6a8a96;
            padding: 2px 10px;
            border-radius: 20px;
            background: #0d1c26;
            border: 1px solid #2a4a5a;
            letter-spacing: 0.5px;
        }
        .phase-indicator.phase-colors { border-color: #ffd966; color: #ffd966; }
        .phase-indicator.phase-last-red { border-color: #ff6b6b; color: #ff6b6b; animation: pulse-red 1s ease-in-out infinite; }
        .phase-indicator.phase-reds { border-color: #66aadd; color: #66aadd; }
        .phase-indicator.phase-shot-available { border-color: #66aadd; color: #66aadd; animation: pulse-pass 1.5s ease-in-out infinite; }
        @keyframes pulse-pass { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        @media (max-width: 520px) {
            h1 { font-size: 1.35rem; letter-spacing: 4px; }
            .ball-status { padding: 4px 12px; gap: 4px; }
            .red-counter { font-size: 1.1rem; }
            .red-counter .number { font-size: 1.4rem; }
            .color-ball { width: 22px; height: 22px; }
            .ball-status .label { font-size: 0.7rem; }
            .frame-over-badge { font-size: 0.7rem; padding: 1px 10px; }
        }
        @media (max-width: 400px) {
            .color-ball { width: 18px; height: 18px; }
            .red-counter { font-size: 0.95rem; }
            .red-counter .number { font-size: 1.2rem; }
        }

        .players { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: center; }

        .turn-arrow {
            flex: 0 0 auto;
            width: 32px;
            text-align: center;
            font-size: 1.9rem;
            line-height: 1;
            color: #ffd966;
            text-shadow: 0 0 16px #ffd966aa, 0 0 4px #ffd966;
            opacity: 0;
            transition: opacity 0.15s ease;
            pointer-events: none;
        }
        .turn-arrow.active { opacity: 1; }
        #arrowA.active { animation: nudge-right 1.1s ease-in-out infinite; }
        #arrowB.active { animation: nudge-left 1.1s ease-in-out infinite; }
        @keyframes nudge-right { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(5px); } }
        @keyframes nudge-left { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(-5px); } }
        @media (max-width: 520px) { .turn-arrow { width: 22px; font-size: 1.3rem; } }

        .middle-controls {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 150px;
        }
        .middle-controls > .btn {
            flex: 0 0 auto;
            width: 100%;
            min-width: 0;
            padding: 16px 8px;
            font-size: 1rem;
            white-space: nowrap;
        }
        .start-picker { display: flex; flex-direction: column; gap: 4px; }
        .start-picker-label {
            font-size: 0.6rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #6a8a96;
            text-align: center;
        }
        .start-picker-btns { display: flex; gap: 6px; }
        .start-picker-btns .btn {
            flex: 1 1 0;
            min-width: 0;
            padding: 8px 4px;
            font-size: 0.8rem;
            background: #223c48;
            border: 2px solid #2a4a5a;
            color: #9fbcc8;
            box-shadow: 0 3px 0 #0f1e26;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .start-picker-btns .btn.current {
            background: #24463a;
            border-color: #ffd966;
            color: #ffd966;
            box-shadow: 0 0 14px #ffd96655, 0 3px 0 #0f1e26;
        }
        @media (max-width: 520px) {
            .middle-controls { flex: 1 1 100%; width: 100%; flex-direction: row; flex-wrap: wrap; }
            .middle-controls > .btn { flex: 1 1 0; font-size: 0.9rem; padding: 12px 6px; }
            .start-picker { flex: 1 1 100%; }
        }
        .player-card {
            flex: 1;
            min-width: 220px;
            background: #162b36;
            border-radius: 48px 48px 28px 28px;
            padding: 14px 12px 18px;
            box-shadow: inset 0 -6px 0 #0b171f, 0 8px 12px rgba(0,0,0,0.5);
            border-bottom: 3px solid #d4af37;
            transition: 0.1s;
            cursor: default;
        }
        .player-card.active-turn {
            border-bottom: 6px solid #ffd966;
            box-shadow: 0 0 18px #ffd96666;
        }
        .player-card.frame-over { border-bottom-color: #ff6b6b; opacity: 0.8; }

        .player-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-bottom: 2px;
            flex-wrap: nowrap;
            min-height: 3.2rem;
        }
        .player-name {
            font-size: 1.7rem;
            font-weight: 600;
            color: #dceaf0;
            text-align: center;
            letter-spacing: 1px;
            padding: 4px 6px;
            border-radius: 40px;
            transition: background 0.15s;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            white-space: nowrap;
            max-width: 55%;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-shrink: 1;
            min-width: 0;
        }
        .player-name:hover { background: #2a4a5a66; }
        .player-name .edit-icon { font-size: 0.8rem; opacity: 0.4; transition: opacity 0.2s; flex-shrink: 0; }
        .player-name:hover .edit-icon { opacity: 1; }
        .player-name-input {
            background: #0d1c26;
            border: 2px solid #d4af37;
            border-radius: 40px;
            color: #f5f9ff;
            font-size: 1.3rem;
            font-weight: 600;
            text-align: center;
            padding: 2px 10px;
            width: 100%;
            max-width: 150px;
            outline: none;
            font-family: inherit;
            letter-spacing: 1px;
            white-space: nowrap;
        }
        .player-name-input::placeholder { color: #5a7a8a; font-weight: 400; font-size: 1rem; }

        .frame-badge {
            font-size: 2rem;
            font-weight: 700;
            color: #8aacba;
            background: #0d1c26;
            padding: 0 12px;
            border-radius: 40px;
            border: 2px solid #2a5a6a;
            letter-spacing: 1px;
            line-height: 1.3;
            display: inline-flex;
            align-items: center;
            gap: 2px;
            min-width: 48px;
            justify-content: center;
            transition: all 0.2s;
            text-shadow: 0 0 8px rgba(127, 201, 255, 0.2);
            flex-shrink: 0;
        }
        .frame-badge .trophy { font-size: 1.2rem; }
        .frame-badge .number { color: #ffd966; font-size: 2.2rem; min-width: 24px; text-align: center; }
        .player-card.active-turn .frame-badge { border-color: #ffd966; box-shadow: 0 0 20px #ffd96644; background: #1a2a2a; }
        .player-card.active-turn .frame-badge .number { color: #ffdd88; text-shadow: 0 0 20px #ffd96688; }

        @media (max-width: 520px) {
            .player-header { min-height: 2.6rem; gap: 4px; }
            .player-name { font-size: 1.2rem; max-width: 50%; }
            .player-name-input { font-size: 1rem; max-width: 100px; }
            .frame-badge { font-size: 1.4rem; padding: 0 8px; min-width: 36px; }
            .frame-badge .number { font-size: 1.6rem; min-width: 18px; }
            .frame-badge .trophy { font-size: 1rem; }
        }
        @media (max-width: 400px) {
            .player-name { font-size: 1rem; max-width: 45%; }
            .frame-badge { font-size: 1.1rem; padding: 0 6px; min-width: 30px; }
            .frame-badge .number { font-size: 1.3rem; min-width: 14px; }
        }

        .player-score {
            font-size: clamp(5rem, 8.5vw, 8.5rem);
            font-weight: 700;
            text-align: center;
            color: #f5f9ff;
            background: #0d1c26;
            border-radius: 60px;
            padding: 4px 0;
            margin: 6px 0 10px;
            box-shadow: inset 0 4px 8px #00000066;
            letter-spacing: 4px;
            text-shadow: 0 0 12px #7fc9ff77;
        }
        @media (max-width: 520px) { .player-score { font-size: 3.2rem; } }

        .btn-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }
        .btn-grid .btn {
            font-size: 1.1rem;
            padding: 10px 4px;
            min-width: 44px;
        }
        .btn {
            border: none;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1.25rem;
            padding: 14px 6px;
            min-width: 52px;
            flex: 1 0 21%;
            background: #2f4b5a;
            color: #f0f8ff;
            box-shadow: 0 5px 0 #0f1e26, 0 4px 10px #00000044;
            transition: all 0.04s ease;
            touch-action: manipulation;
            cursor: pointer;
            text-shadow: 0 1px 0 #00000066;
            letter-spacing: 0.5px;
            position: relative;
        }
        .btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 #0f1e26; }
        .btn:disabled {
            opacity: 0.3;
            transform: translateY(2px);
            box-shadow: 0 2px 0 #0f1e26;
            pointer-events: none;
            cursor: not-allowed;
        }
        .btn-red { background: #b13e3e; }
        .btn-yellow { background: #c9a82b; color: #1e1a0a; }
        .btn-green { background: #2e7d4e; }
        .btn-brown { background: #7a4d2b; }
        .btn-blue { background: #2a6b9c; }
        .btn-pink { background: #b8477a; }
        .btn-black { background: #2b2b2e; border: 1px solid #5f5f5f; }
        .btn-foul { background: #7a2e3a; }
        .btn-undo { background: #5d4f3a; }
        .btn-concede { background: #4a3a52; color: #dcd0e4; }
        .btn-reset { background: #3a2f2f; color: #dbbdbd; }
        .btn-shot-taken {
            background: #2a6b8c;
            border: 2px solid #66aadd;
        }

        .btn.next-allowed {
            box-shadow: 0 0 20px #ffd96688, 0 5px 0 #0f1e26;
            border: 2px solid #ffd966;
        }
        .btn.red-allowed {
            box-shadow: 0 0 20px #ff6b6b66, 0 5px 0 #0f1e26;
            border: 2px solid #ff6b6b;
        }
        .btn.color-after-last-red {
            box-shadow: 0 0 20px #ff6b6b88, 0 5px 0 #0f1e26;
            border: 2px solid #ff6b6b;
            animation: pulse-red 0.8s ease-in-out infinite;
        }

        @media (max-width: 520px) {
            .btn { font-size: 1rem; min-width: 40px; padding: 12px 4px; }
            .btn-grid .btn { font-size: 1rem; padding: 9px 4px; }
            .action-row .btn { font-size: 1rem; min-width: 90px; padding: 14px 6px; }
        }
        @media (min-width: 900px) {
            .btn { font-size: 1.5rem; padding: 18px 8px; }
            .btn-grid .btn { font-size: 1.1rem; padding: 10px 4px; max-width: 84px; }
            .middle-controls > .btn { font-size: 1.15rem; padding: 18px 10px; }
            .start-picker-btns .btn { font-size: 0.9rem; }
            .action-row .btn { font-size: 1.5rem; }
        }

        .action-row {
            display: flex;
            gap: 14px;
            margin: 14px 0 4px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .action-row .btn {
            flex: 1;
            min-width: 100px;
            padding: 16px 8px;
            font-size: 1.3rem;
            border-radius: 48px;
        }
        .footer-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .footer-note {
            color: #4a6a76;
            text-align: center;
            font-size: 0.8rem;
            letter-spacing: 2px;
        }
        .lang-switch {
            display: inline-flex;
            gap: 3px;
            padding: 2px;
            background: #0d1c26;
            border: 1px solid #2a4a5a;
            border-radius: 20px;
        }
        .lang-chip {
            border: none;
            background: transparent;
            color: #6a8a96;
            font-family: inherit;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            padding: 3px 10px;
            border-radius: 16px;
            cursor: pointer;
            touch-action: manipulation;
        }
        .lang-chip.active { background: #2a6b8c; color: #f0f8ff; }
        .page-version {
            color: #6a8a96;
            text-align: center;
            margin-top: 4px;
            font-size: 0.7rem;
            letter-spacing: 2px;
            font-weight: 700;
            opacity: 0.9;
        }

        .foul-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(2px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            touch-action: manipulation;
        }
        .foul-box {
            background: #1a2f3a;
            border-radius: 48px;
            padding: 26px 20px;
            max-width: 420px;
            width: 90%;
            text-align: center;
            border: 2px solid #d4af37;
            box-shadow: 0 20px 40px #000;
        }
        .foul-box h2 { color: #d4af37; margin-top: 0; }
        .foul-box p { color: #c8dbe4; margin-bottom: 12px; }
        .foul-note {
            color: #8aa8b4;
            font-size: 0.85rem;
            margin-bottom: 14px;
            line-height: 1.4;
        }
        .foul-note strong { color: #ffd966; }
        .foul-btn-grid { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .foul-btn-grid .btn { flex: 0 0 auto; padding: 14px 20px; min-width: 60px; }
        .foul-btn-grid .btn.selected {
            border: 2px solid #ffd966;
            box-shadow: 0 0 18px #ffd96688, 0 5px 0 #0f1e26;
        }
        .foul-btn-grid .btn-cancel { background: #5a4a3a; flex: 1 0 60%; }
        .btn-red-toggle {
            background: #2f2f3a;
            border: 2px solid #4a4a5a;
            color: #b8c8d0;
            width: 100%;
            flex: 0 0 auto;
            margin-top: 16px;
            padding: 13px 10px;
            font-size: 0.95rem;
        }
        .btn-red-toggle.on {
            background: #7a2e2e;
            border-color: #ff6b6b;
            color: #ffe0e0;
            box-shadow: 0 0 16px #ff6b6b66, 0 4px 0 #0f1e26;
        }
        .btn-red-toggle:disabled { opacity: 0.3; }
        .foul-actions { display: flex; gap: 12px; margin-top: 16px; }
        .foul-actions .btn { flex: 1; padding: 16px 8px; font-size: 1.15rem; }
        .foul-actions .btn-pass-confirm { background: #2a6b8c; border: 2px solid #66aadd; }
        .foul-actions .btn-cancel { background: #5a4a3a; }

        .debug-panel {
            background: #0d1c26;
            border: 1px solid #2a4a5a;
            border-radius: 12px;
            padding: 6px 14px;
            margin-top: 6px;
            font-family: 'Courier New', monospace;
            font-size: 0.7rem;
            color: #6a8a96;
            display: flex;
            flex-wrap: wrap;
            gap: 6px 16px;
            justify-content: center;
        }
        .debug-panel .debug-item { display: inline-flex; align-items: center; gap: 4px; }
        .debug-panel .debug-label { color: #4a6a7a; }
        .debug-panel .debug-value { color: #aac8d4; font-weight: 600; }
        .debug-panel .debug-value.true { color: #66dd88; }
        .debug-panel .debug-value.false { color: #dd6666; }
        .debug-panel .debug-value.phase { color: #ffd966; }
    </style>
</head>
<body>
<div class="scoreboard" id="app">
    <h1 data-i18n="title">🎱 S N O O K E R</h1>

    <div class="ball-status">
        <span class="label" data-i18n="onTable">ON TABLE</span>
        <span class="red-counter" id="redCounter">
            🔴 <span class="number" id="redCount">15</span>
        </span>
        <div class="color-balls" id="colorBalls">
            <div class="color-ball yellow" data-color="yellow" data-value="2"></div>
            <div class="color-ball green" data-color="green" data-value="3"></div>
            <div class="color-ball brown" data-color="brown" data-value="4"></div>
            <div class="color-ball blue" data-color="blue" data-value="5"></div>
            <div class="color-ball pink" data-color="pink" data-value="6"></div>
            <div class="color-ball black" data-color="black" data-value="7"></div>
        </div>
        <span class="phase-indicator" id="phaseIndicator">🔴 Reds</span>
        <span class="frame-over-badge" id="frameOverBadge" data-i18n="frameOverBadge">🏁 FRAME OVER</span>
    </div>

    <div class="players">
        <div class="turn-arrow" id="arrowA">▶</div>

        <div class="player-card" id="cardA">
            <div class="player-header">
                <div class="player-name" id="nameA" data-player="A">Player A <span class="edit-icon">✎</span></div>
                <div class="frame-badge" id="framesA">

</div>
<script>
    (function() {
        'use strict';

        const APP_VERSION = 'v1.4.0';
        const MAX_REDS = 15;
        const COLOR_ORDER = ['yellow', 'green', 'brown', 'blue', 'pink', 'black'];
        const COLOR_VALUE_MAP = {
            'yellow': 2, 'green': 3, 'brown': 4,
            'blue': 5, 'pink': 6, 'black': 7
        };
        const VALUE_TO_COLOR = { 2: 'yellow', 3: 'green', 4: 'brown', 5: 'blue', 6: 'pink', 7: 'black' };
        // Pink is missing: there is no pink circle emoji, so it is drawn as a .ball-dot
        const COLOR_EMOJI = {
            yellow: '🟡', green: '🟢', brown: '🟤',
            blue: '🔵', black: '⚫'
        };

        function ballMark(colorKey) {
            if (colorKey === 'pink') return '<span class="ball-dot pink"></span>';
            return COLOR_EMOJI[colorKey] || '';
        }

        // ============================================================
        // LOCALIZATION
        // ============================================================
        const LANG_KEY = 'snooker_lang';

        const I18N = {
            en: {
                docTitle: 'Snooker Scoreboard',
                title: '🎱 S N O O K E R',
                onTable: 'ON TABLE',
                frameOverBadge: '🏁 FRAME OVER',
                startPlay: 'START PLAY',
                shotTaken: '🎯 Shot Taken',
                foul: '⚖️ Foul',
                undo: '↩️ Undo',
                concede: '🏳️ Concede',
                concedeTitle: '🏳️ Concede frame',
                concedePrompt: 'Who concedes? The frame is awarded to the other player.',
                newFrame: '🔄 New Frame',
                resetMatch: '🏆 Reset Match',
                resetMatchConfirm: 'Reset entire match? All frames, scores, and names will be reset.',
                footer: 'tap name to edit · full screen F11 · auto-save',
                twoReds: 'Two reds potted in one stroke (2 points)',
                version: (v) => `Version ${v}`,
                defaultNameA: 'Player A',
                defaultNameB: 'Player B',
                toPlay: (name) => `${name} to play`,
                enterName: 'Enter name...',
                phaseReds: '🔴 Reds',
                phaseAnyColor: '🎯 Pot ANY color!',
                phaseNextColor: (color) => `🎯 ${color} next`,
                phaseOver: '🏁 Over',
                phaseRespottedBlack: '⚫ Re-spotted black — draw lots!',
                phaseShort: { reds: 'reds', 'last-red': 'last-red', colors: 'colors', 'respotted-black': 're-spotted black', over: 'over' },
                colors: { yellow: 'Yellow', green: 'Green', brown: 'Brown', blue: 'Blue', pink: 'Pink', black: 'Black' },
                ballOn: (color) => `${color} on`,
                redOn: '🔴 Red on',
                anyColorOn: '🎯 Any color on',
                pointsTo: (name) => `Points to <strong>${name}</strong>`,
                minimum: (n, ballOn) => `Minimum <strong>${n}</strong> — ${ballOn}`,
                redAlsoPotted: '🔴 Red also potted (−1 red)',
                redPottedOn: '✅ 🔴 Red potted on the foul — 1 red removed',
                redStaysDown: 'Potted red stays down (not re-spotted)',
                noRedsLeft: 'No reds left on the table',
                apply: (n) => `✅ Apply ${n}`,
                applyWithRed: (n) => `✅ Apply ${n} + red`,
                cancel: '❌ Cancel',
                dbgPhase: 'Phase:',
                dbgReds: 'Reds:',
                dbgColors: 'Colors Potted:',
                dbgFrameOver: 'Frame Over:',
                dbgTurn: 'Turn:',
                dbgScoreA: 'Score A:',
                dbgScoreB: 'Score B:',
                none: 'none',
                yes: 'true',
                no: 'false'
            },
            zh: {
                docTitle: '斯诺克记分牌',
                title: '🎱 斯 诺 克',
                onTable: '台面剩余',
                frameOverBadge: '🏁 本局结束',
                startPlay: '开球方',
                shotTaken: '🎯 本轮结束',
                foul: '⚖️ 犯规',
                undo: '↩️ 撤销',
                concede: '🏳️ 认输',
                concedeTitle: '🏳️ 认输',
                concedePrompt: '谁认输？本局判给对手获胜。',
                newFrame: '🔄 新一局',
                resetMatch: '🏆 重置比赛',
                resetMatchConfirm: '确定重置整场比赛？所有局数、比分和姓名都将被重置。',
                footer: '点击姓名可编辑 · F11 全屏 · 自动保存',
                twoReds: '一杆打进两颗红球（2 分）',
                version: (v) => `版本 ${v}`,
                defaultNameA: '玩家 A',
                defaultNameB: '玩家 B',
                toPlay: (name) => `${name} 击球`,
                enterName: '输入姓名...',
                phaseReds: '🔴 红球',
                phaseAnyColor: '🎯 任意彩球',
                phaseNextColor: (color) => `🎯 下一颗：${color}`,
                phaseOver: '🏁 结束',
                phaseRespottedBlack: '⚫ 重摆黑球 — 抽签定先手！',
                phaseShort: { reds: '红球', 'last-red': '最后红球', colors: '彩球', 'respotted-black': '重摆黑球', over: '结束' },
                colors: { yellow: '黄球', green: '绿球', brown: '咖啡球', blue: '蓝球', pink: '粉球', black: '黑球' },
                ballOn: (color) => color,
                redOn: '🔴 红球',
                anyColorOn: '🎯 任意彩球',
                pointsTo: (name) => `加分给 <strong>${name}</strong>`,
                minimum: (n, ballOn) => `最少 <strong>${n}</strong> 分 — ${ballOn}`,
                redAlsoPotted: '🔴 同时打进红球（−1 红球）',
                redPottedOn: '✅ 🔴 犯规时打进红球 — 移除 1 颗红球',
                redStaysDown: '打进的这颗红球不再摆回台面',
                noRedsLeft: '台面已无红球',
                apply: (n) => `✅ 确认 ${n} 分`,
                applyWithRed: (n) => `✅ 确认 ${n} 分 + 红球`,
                cancel: '❌ 取消',
                dbgPhase: '阶段:',
                dbgReds: '红球:',
                dbgColors: '已打进彩球:',
                dbgFrameOver: '本局结束:',
                dbgTurn: '击球方:',
                dbgScoreA: 'A 得分:',
                dbgScoreB: 'B 得分:',
                none: '无',
                yes: '是',
                no: '否'
            }
        };

        let lang = 'en';

        function t(key, ...args) {
            const pack = I18N[lang] || I18N.en;
            const value = pack[key] !== undefined ? pack[key] : I18N.en[key];
            if (typeof value === 'function') return value(...args);
            return value === undefined ? key : value;
        }

        function colorLabel(colorKey) {
            const pack = (I18N[lang] || I18N.en).colors;
            return pack[colorKey] || colorKey;
        }

        // A player name is only replaced when it is still an untouched default
        function localizeDefaultNames() {
            const packs = Object.keys(I18N).map(k => I18N[k]);
            if (packs.some(p => state.nameA === p.defaultNameA)) state.nameA = t('defaultNameA');
            if (packs.some(p => state.nameB === p.defaultNameB)) state.nameB = t('defaultNameB');
        }

        function phaseShortLabel() {
            const map = (I18N[lang] || I18N.en).phaseShort || {};
            return map[state.phase] || state.phase;
        }

        // ============================================================
        // STATE MACHINE
        // ============================================================
        // PHASES:
        //   'reds'             - Normal red phase. Pot red → then color → repeat.
        //   'last-red'         - After potting the last red. ANY color can be potted.
        //   'colors'           - Colors phase. Must pot in order: yellow, green, brown, blue, pink, black.
        //   'respotted-black'  - Level scores after the Black: Black re-spotted, first pot or foul wins (§3 R4(b)).
        //   'over'             - Frame is over.
        // ============================================================

        const state = {
            // Players
            A: 0,
            B: 0,
            turn: 'A',
            breaker: 'A',        // who started this frame — must alternate every frame (§3 R3(b))
            frameAwarded: false, // set when the frame was already awarded (concession)
            history: [],
            nameA: I18N.en.defaultNameA,
            nameB: I18N.en.defaultNameB,
            framesA: 0,
            framesB: 0,

            // Game state
            reds: MAX_REDS,
            colorsPotted: [false, false, false, false, false, false], // yellow, green, brown, blue, pink, black
            frameOver: false,
            phase: 'reds', // 'reds' | 'last-red' | 'colors' | 'over'

            // Track if a red was potted this visit (for color legality during red phase)
            redPottedThisVisit: false,

            // Track which color was potted after the last red
            colorAfterLastRed: null,
        };

        // DOM refs
        const scoreA = document.getElementById('scoreA');
        const scoreB = document.getElementById('scoreB');
        const cardA = document.getElementById('cardA');
        const cardB = document.getElementById('cardB');
        const nameAEl = document.getElementById('nameA');
        const nameBEl = document.getElementById('nameB');
        const frameCountA = document.getElementById('frameCountA');
        const frameCountB = document.getElementById('frameCountB');
        const redCountEl = document.getElementById('redCount');
        const redCounterEl = document.getElementById('redCounter');
        const colorBallsEl = document.getElementById('colorBalls');
        const frameOverBadge = document.getElementById('frameOverBadge');
        const phaseIndicator = document.getElementById('phaseIndicator');
        const appVersionEl = document.getElementById('appVersion');
        const undoBtn = document.getElementById('undoBtn');
        const resetBtn = document.getElementById('resetBtn');
        const resetMatchBtn = document.getElementById('resetMatchBtn');
        const shotTakenBtn = document.getElementById('shotTakenBtn');
        const foulBtn = document.getElementById('foulBtn');
        const startABtn = document.getElementById('startABtn');
        const startBBtn = document.getElementById('startBBtn');
        const arrowA = document.getElementById('arrowA');
        const arrowB = document.getElementById('arrowB');
        const concedeBtn = document.getElementById('concedeBtn');
        const langChips = Array.from(document.querySelectorAll('.lang-chip'));

        // Debug elements
        const debugPhase = document.getElementById('debugPhase');
        const debugReds = document.getElementById('debugReds');
        const debugColors = document.getElementById('debugColors');
        const debugFrameOver = document.getElementById('debugFrameOver');
        const debugTurn = document.getElementById('debugTurn');
        const debugScoreA = document.getElementById('debugScoreA');
        const debugScoreB = document.getElementById('debugScoreB');

        // ============================================================
        // HELPERS
        // ============================================================

        function getNextColorIndex() {
            for (let i = 0; i < state.colorsPotted.length; i++) {
                if (!state.colorsPotted[i]) return i;
            }
            return -1;
        }

        function getNextColorValue() {
            const idx = getNextColorIndex();
            if (idx === -1) return -1;
            return COLOR_VALUE_MAP[COLOR_ORDER[idx]];
        }

        function getNextColorName() {
            const idx = getNextColorIndex();
            if (idx === -1) return null;
            return COLOR_ORDER[idx];
        }

        function isColorPotted(colorIndex) {
            if (colorIndex < 0 || colorIndex >= state.colorsPotted.length) return true;
            return state.colorsPotted[colorIndex];
        }

        function getColorIndex(value) {
            if (value < 2 || value > 7) return -1;
            const name = VALUE_TO_COLOR[value];
            return COLOR_ORDER.indexOf(name);
        }

        // ============================================================
        // CORE GAME LOGIC
        // ============================================================

        // Potting one or more reds in a single stroke is legal (two reds = 2 points)
        function canPotReds(count = 1) {
            if (state.frameOver) return false;
            if (state.phase !== 'reds') return false;
            if (state.reds < count) return false;
            if (state.redPottedThisVisit) return false;
            return true;
        }

        function canPotRed() {
            return canPotReds(1);
        }

        function canPotColor(value) {
            if (state.frameOver) return false;
            if (state.phase === 'over') return false;
            if (value < 2 || value > 7) return false;

            const colorIndex = getColorIndex(value);
            if (colorIndex === -1) return false;

            // If this color is already permanently potted, it's not available
            if (state.colorsPotted[colorIndex]) return false;

            // --- PHASE: last-red ---
            // After the last red, ANY unpotted color can be potted
            if (state.phase === 'last-red') {
                return true;
            }

            // --- PHASE: reds ---
            // During red phase, color is only legal after a red was potted
            if (state.phase === 'reds') {
                return state.redPottedThisVisit;
            }

            // --- PHASE: colors ---
            // Must pot colors in order
            if (state.phase === 'colors') {
                const nextValue = getNextColorValue();
                if (nextValue === -1) return false;
                return value === nextValue;
            }

            // --- PHASE: respotted-black ---
            if (state.phase === 'respotted-black') {
                return value === 7;
            }

            return false;
        }

        // §3 R4(b): scores level — the Black is spotted, the players draw lots for choice of
        // playing next, the next player plays from in-hand and the first pot or foul wins.
        function startRespottedBlack(nextPlayer) {
            state.colorsPotted = [true, true, true, true, true, false];
            state.phase = 'respotted-black';
            state.frameOver = false;
            state.redPottedThisVisit = false;
            state.colorAfterLastRed = null;
            state.turn = (nextPlayer === 'A' || nextPlayer === 'B')
                ? nextPlayer
                : (state.turn === 'A' ? 'B' : 'A');
        }

        // The Black is the only object ball left on the table (see §3 R4(a))
        function isBlackOnly() {
            return state.reds === 0
                && !state.colorsPotted[5]
                && state.colorsPotted.slice(0, 5).every(potted => potted);
        }

        // A visit can end after ANY stroke — a pot or a miss — so this stays available for
        // the whole frame. Pressing it hands the table to the other player.
        function canTakeShot() {
            return !state.frameOver && state.phase !== 'over';
        }

        function getPhaseDisplay() {
            switch (state.phase) {
                case 'reds': return t('phaseReds');
                case 'last-red': return t('phaseAnyColor');
                case 'colors': {
                    const next = getNextColorName();
                    return next ? t('phaseNextColor', colorLabel(next)) : t('phaseOver');
                }
                case 'respotted-black': return t('phaseRespottedBlack');
                case 'over': return t('phaseOver');
                default: return '❓';
            }
        }

        function getPhaseClass() {
            switch (state.phase) {
                case 'reds': return 'phase-reds';
                case 'last-red': return 'phase-last-red';
                case 'colors': return 'phase-colors';
                case 'over': return 'phase-over';
                default: return '';
            }
        }

        // ============================================================
        // RENDER
        // ============================================================

        function render() {
            // Scores
            scoreA.textContent = state.A;
            scoreB.textContent = state.B;
            frameCountA.textContent = state.framesA;
            frameCountB.textContent = state.framesB;
            redCountEl.textContent = state.reds;

            redCounterEl.classList.toggle('all-potted', state.reds === 0);

            // Color balls
            const balls = colorBallsEl.querySelectorAll('.color-ball');
            const nextColorName = getNextColorName();

            balls.forEach((ball, index) => {
                const color = ball.getAttribute('data-color');
                const isPotted = state.colorsPotted[index];

                ball.classList.toggle('potted', isPotted);
                ball.classList.remove('next-color', 'available-after-last-red');

                if (state.phase === 'last-red' && !isPotted) {
                    ball.classList.add('available-after-last-red');
                } else if ((state.phase === 'colors' || state.phase === 'respotted-black') && !isPotted && color === nextColorName) {
                    ball.classList.add('next-color');
                }
            });

            // Player names
            if (!nameAEl.querySelector('input')) {
                nameAEl.innerHTML = `${state.nameA} <span class="edit-icon">✎</span>`;
            }
            if (!nameBEl.querySelector('input')) {
                nameBEl.innerHTML = `${state.nameB} <span class="edit-icon">✎</span>`;
            }

            // Active turn
            cardA.classList.toggle('active-turn', state.turn === 'A' && !state.frameOver);
            cardB.classList.toggle('active-turn', state.turn === 'B' && !state.frameOver);
            cardA.classList.toggle('frame-over', state.frameOver);
            cardB.classList.toggle('frame-over', state.frameOver);

            // Turn arrows point at the player whose visit it is
            arrowA.classList.toggle('active', state.turn === 'A' && !state.frameOver);
            arrowB.classList.toggle('active', state.turn === 'B' && !state.frameOver);

            // Frame over badge
            frameOverBadge.classList.toggle('active', state.frameOver);

            // Phase indicator
            phaseIndicator.textContent = getPhaseDisplay();
            phaseIndicator.className = 'phase-indicator ' + getPhaseClass();

            // Buttons
            updateButtons();

            // Start-play picker also shows who is at the table
            updateStartPicker();

            // Undo
            undoBtn.disabled = (state.history.length === 0);

            // Debug
            debugPhase.textContent = phaseShortLabel();
            debugReds.textContent = state.reds;

            const potted = [];
            state.colorsPotted.forEach((p, i) => {
                if (p) potted.push(COLOR_ORDER[i]);
            });
            debugColors.textContent = potted.length ? potted.map(colorLabel).join(', ') : t('none');

            debugFrameOver.textContent = state.frameOver ? t('yes') : t('no');
            debugFrameOver.className = 'debug-value ' + (state.frameOver ? 'true' : 'false');
            debugTurn.textContent = state.turn;
            debugScoreA.textContent = state.A;
            debugScoreB.textContent = state.B;

            appVersionEl.textContent = t('version', APP_VERSION);

            // Save state
            try {
                localStorage.setItem('snooker_state_v2', JSON.stringify(state));
            } catch (e) {}

            // Log for debugging
            console.log(`[State] Phase: ${state.phase}, Reds: ${state.reds}, Colors: [${potted.join(', ') || 'none'}], Turn: ${state.turn}`);
        }

        function updateButtons() {
            const allButtons = document.querySelectorAll('.btn-grid .btn');
            const nextColorName = getNextColorName();

            allButtons.forEach(btn => {
                const player = btn.getAttribute('data-player');
                const value = btn.getAttribute('data-value');
                const val = parseInt(value, 10);
                btn.classList.remove('color-after-last-red', 'next-allowed', 'red-allowed');

                // Only the player at the table can pot a ball
                if (state.frameOver || player !== state.turn) {
                    btn.disabled = true;
                    return;
                }

                if (val === 1) {
                    const redCount = parseInt(btn.getAttribute('data-reds') || '1', 10);
                    const canPot = canPotReds(redCount);
                    btn.disabled = !canPot;
                    if (canPot) btn.classList.add('red-allowed');
                } else if (val >= 2 && val <= 7) {
                    const canPot = canPotColor(val);
                    btn.disabled = !canPot;
                    const colorName = VALUE_TO_COLOR[val];

                    if (state.phase === 'last-red' && canPot) {
                        btn.classList.add('color-after-last-red');
                    }

                    if ((state.phase === 'colors' || state.phase === 'respotted-black') && colorName === nextColorName && canPot) {
                        btn.classList.add('next-allowed');
                    }
                }
            });

            // Middle controls: only the player at the table can end a visit or foul
            shotTakenBtn.disabled = !canTakeShot();
            foulBtn.disabled = state.frameOver;
            concedeBtn.disabled = state.frameOver;
        }

        function updateStartPicker() {
            startABtn.textContent = state.nameA;
            startBBtn.textContent = state.nameB;
            startABtn.title = t('toPlay', state.nameA);
            startBBtn.title = t('toPlay', state.nameB);
            startABtn.classList.toggle('current', state.turn === 'A' && !state.frameOver);
            startBBtn.classList.toggle('current', state.turn === 'B' && !state.frameOver);
            startABtn.disabled = state.frameOver;
            startBBtn.disabled = state.frameOver;
        }

        // ============================================================
        // ACTIONS
        // ============================================================

        // Hand the table to a player — used to pick who starts the frame
        function handOverTo(player) {
            if (state.frameOver) return;
            if (player !== 'A' && player !== 'B') return;
            if (state.turn === player) return;

            state.redPottedThisVisit = false;
            // If the last red is gone, the colours sequence starts with the incoming player
            if (state.phase === 'last-red') state.phase = 'colors';
            state.turn = player;
            render();
        }

        // One tap: end the visit and hand the table to the other player (no confirmation)
        function takeShot() {
            if (!canTakeShot()) return;
            handOverTo(state.turn === 'A' ? 'B' : 'A');
        }

        // Picking a player before the frame has begun also sets who breaks off next frame
        function selectStarter(player) {
            if (state.frameOver) return;
            if (state.history.length === 0 && state.A === 0 && state.B === 0) state.breaker = player;
            handOverTo(player);
        }

        // §2 Def 1(a): an accepted concession ends the frame — it is awarded to the opponent
        function showConcedeDialog() {
            if (state.frameOver) return;

            const overlay = document.createElement('div');
            overlay.className = 'foul-overlay';
            overlay.innerHTML = `
                <div class="foul-box">
                    <h2>${t('concedeTitle')}</h2>
                    <p>${t('concedePrompt')}</p>
                    <div class="foul-btn-grid">
                        <button class="btn btn-concede" data-concede="A">${state.nameA}</button>
                        <button class="btn btn-concede" data-concede="B">${state.nameB}</button>
                    </div>
                    <div class="foul-actions">
                        <button class="btn btn-cancel" id="concedeCancelBtn">${t('cancel')}</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);

            overlay.querySelectorAll('[data-concede]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const who = btn.getAttribute('data-concede');
                    document.body.removeChild(overlay);
                    concedeFrame(who);
                });
            });
            overlay.querySelector('#concedeCancelBtn').addEventListener('click', () => {
                document.body.removeChild(overlay);
            });
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) document.body.removeChild(overlay);
            });
        }

        function concedeFrame(conceder) {
            if (state.frameOver) return;
            const winner = conceder === 'A' ? 'B' : 'A';

            // Undoable: remember the scores and frames exactly as they were
            state.history.push({
                player: winner,
                delta: 0,
                newTotal: state[winner],
                concede: true,
                framesABefore: state.framesA,
                framesBBefore: state.framesB,
                redsBefore: state.reds,
                colorsPottedBefore: [...state.colorsPotted],
                frameOverBefore: state.frameOver,
                redPottedThisVisitBefore: state.redPottedThisVisit,
                phaseBefore: state.phase,
                colorAfterLastRedBefore: state.colorAfterLastRed,
                turnBefore: state.turn,
            });

            if (winner === 'A') state.framesA += 1;
            else state.framesB += 1;

            state.frameAwarded = true;
            state.frameOver = true;
            state.phase = 'over';
            render();
        }

        function addPoints(player, value, redCount = 1) {
            if (player !== 'A' && player !== 'B') return;
            // Only the player at the table can score
            if (player !== state.turn) return;
            if (value === 'foul') {
                if (state.frameOver) return;
                showFoulDialog(player);
                return;
            }

            const parsed = parseInt(value, 10);
            if (isNaN(parsed) || parsed < 1) return;

            const isRed = parsed === 1;
            const count = isRed ? Math.max(1, parseInt(redCount, 10) || 1) : 1;
            const delta = isRed ? count : parsed;

            // Validation
            if (isRed) {
                if (!canPotReds(count)) return;
            } else if (parsed >= 2 && parsed <= 7) {
                if (!canPotColor(parsed)) return;
            }

            // Save history BEFORE modifying state
            const historyEntry = {
                player,
                delta,
                newTotal: state[player] + delta,
                value: delta,
                redsBefore: state.reds,
                colorsPottedBefore: [...state.colorsPotted],
                frameOverBefore: state.frameOver,
                redPottedThisVisitBefore: state.redPottedThisVisit,
                phaseBefore: state.phase,
                colorAfterLastRedBefore: state.colorAfterLastRed,
                turnBefore: state.turn,
            };

            // Apply score
            state[player] += delta;

            // --- Handle RED potting ---
            if (isRed && state.reds > 0) {
                state.reds = Math.max(0, state.reds - count);
                state.redPottedThisVisit = true;

                // Check if the last red went down
                if (state.reds === 0) {
                    // Enter "last-red" phase - ANY color can be potted
                    state.phase = 'last-red';
                    // Reset all colors to available (they were all re-spotted)
                    state.colorsPotted = [false, false, false, false, false, false];
                    state.colorAfterLastRed = null;
                } else {
                    // Still in reds phase
                    state.phase = 'reds';
                }
            }

            // --- Handle COLOR potting ---
            if (!isRed && parsed >= 2 && parsed <= 7) {
                const colorIndex = getColorIndex(parsed);
                const colorName = VALUE_TO_COLOR[parsed];

                if (state.phase === 'last-red') {
                    // The color after the last red is re-spotted, so it stays ON the table.
                    // The colors are then potted in ascending order, starting with yellow.
                    if (colorIndex !== -1) {
                        state.colorAfterLastRed = colorName;
                        state.colorsPotted = [false, false, false, false, false, false];
                        state.phase = 'colors';
                        state.redPottedThisVisit = false;
                    }
                } else if (state.phase === 'colors' || state.phase === 'respotted-black') {
                    // Colors phase - must pot in order (in the re-spotted black only the Black is on)
                    const nextIdx = getNextColorIndex();
                    if (nextIdx === colorIndex) {
                        state.colorsPotted[colorIndex] = true;
                    } else {
                        // Shouldn't happen due to validation
                        state[player] -= delta;
                        return;
                    }
                } else if (state.phase === 'reds') {
                    // During red phase, color is not permanently potted (re-spotted)
                    // Just reset the redPottedThisVisit flag
                    state.redPottedThisVisit = false;
                }
            }

            // --- Check if frame is over ---
            if (state.phase === 'colors') {
                const nextIdx = getNextColorIndex();
                if (nextIdx === -1) {
                    if (state.A === state.B) {
                        // §3 R4(b): scores level — the Black is re-spotted and the frame continues
                        startRespottedBlack(state.turn === 'A' ? 'B' : 'A');
                    } else {
                        state.frameOver = true;
                        state.phase = 'over';
                    }
                }
            }

            // The re-spotted Black ends the frame as soon as it is potted
            if (state.phase === 'respotted-black' && state.colorsPotted[5]) {
                state.frameOver = true;
                state.phase = 'over';
            }

            // If we're in last-red phase and all colors are somehow potted (shouldn't happen)
            if (state.phase === 'last-red') {
                const allPotted = state.colorsPotted.every(p => p === true);
                if (allPotted) {
                    state.frameOver = true;
                    state.phase = 'over';
                }
            }

            // Push history
            state.history.push(historyEntry);

            render();
        }

        // ============================================================
        // FOUL DIALOG
        // ============================================================

        // Minimum foul penalty: 4 points, or the value of the ball on when it is worth more
        function getFoulMinimum() {
            if (state.phase === 'colors') {
                const nextValue = getNextColorValue();
                if (nextValue > 4) return nextValue;
            }
            return 4;
        }

        function getBallOnText() {
            if (state.phase === 'colors') {
                const name = getNextColorName();
                if (!name) return t('phaseOver');
                return `${ballMark(name)} ${t('ballOn', colorLabel(name))}`;
            }
            if (state.phase === 'last-red') return t('anyColorOn');
            return t('redOn');
        }

        function showFoulDialog(player) {
            if (state.frameOver) return;
            const opponent = player === 'A' ? 'B' : 'A';
            const opponentName = player === 'A' ? state.nameB : state.nameA;
            const minPts = getFoulMinimum();
            const redsOnTable = state.reds > 0;

            let selected = minPts;
            let redPotted = false;

            const overlay = document.createElement('div');
            overlay.className = 'foul-overlay';
            overlay.innerHTML = `
                <div class="foul-box">
                    <h2>${t('foul')}</h2>
                    <p>${t('pointsTo', opponentName)}</p>
                    <div class="foul-note" id="foulNote"></div>
                    <div class="foul-btn-grid" id="foulValueGrid">
                        <button class="btn btn-foul" data-foul="4">4</button>
                        <button class="btn btn-foul" data-foul="5">5</button>
                        <button class="btn btn-foul" data-foul="6">6</button>
                        <button class="btn btn-foul" data-foul="7">7</button>
                    </div>
                    <button class="btn btn-red-toggle" id="foulRedToggle"></button>
                    <div class="foul-actions">
                        <button class="btn btn-pass-confirm" id="foulApplyBtn">${t('apply', minPts)}</button>
                        <button class="btn btn-cancel" id="foulCancelBtn">${t('cancel')}</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);

            const valueBtns = Array.from(overlay.querySelectorAll('[data-foul]'));
            const redToggle = overlay.querySelector('#foulRedToggle');
            const applyBtn = overlay.querySelector('#foulApplyBtn');
            const noteEl = overlay.querySelector('#foulNote');

            function refresh() {
                const redsActive = redsOnTable && redPotted;
                valueBtns.forEach(btn => {
                    const value = parseInt(btn.getAttribute('data-foul'), 10);
                    btn.disabled = value < minPts;
                    btn.classList.toggle('selected', value === selected);
                });

                redToggle.disabled = !redsOnTable;
                redToggle.classList.toggle('on', redsActive);
                redToggle.textContent = redsActive ? t('redPottedOn') : t('redAlsoPotted');

                applyBtn.textContent = redsActive ? t('applyWithRed', selected) : t('apply', selected);

                let note = t('minimum', minPts, getBallOnText());
                if (!redsOnTable) note += `<br><span style="color:#6a8a96;">${t('noRedsLeft')}</span>`;
                else if (redsActive) note += `<br><span style="color:#ff8888;">${t('redStaysDown')}</span>`;
                noteEl.innerHTML = note;
            }

            valueBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    selected = parseInt(btn.getAttribute('data-foul'), 10);
                    refresh();
                });
            });

            redToggle.addEventListener('click', () => {
                redPotted = !redPotted;
                refresh();
            });

            applyBtn.addEventListener('click', () => {
                document.body.removeChild(overlay);
                applyFoul(selected, redPotted);
            });

            overlay.querySelector('#foulCancelBtn').addEventListener('click', () => {
                document.body.removeChild(overlay);
            });

            // Tap the backdrop to cancel
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) document.body.removeChild(overlay);
            });

            refresh();
        }

        // Apply a foul: penalty points to the opponent, the visit ends, the table is handed over.
        // A red potted on the foul stays down (it is not re-spotted).
        function applyFoul(pts, redAlsoPotted) {
            if (state.frameOver) return;
            if (isNaN(pts) || pts < 4) return;
            if (redAlsoPotted && state.reds === 0) redAlsoPotted = false;

            const opponent = state.turn === 'A' ? 'B' : 'A';

            // Snapshot for undo BEFORE anything changes
            const historyEntry = {
                player: opponent,
                delta: pts,
                newTotal: state[opponent] + pts,
                foul: true,
                redAlsoPotted: !!redAlsoPotted,
                redsBefore: state.reds,
                colorsPottedBefore: [...state.colorsPotted],
                frameOverBefore: state.frameOver,
                redPottedThisVisitBefore: state.redPottedThisVisit,
                phaseBefore: state.phase,
                colorAfterLastRedBefore: state.colorAfterLastRed,
                turnBefore: state.turn,
            };

            state[opponent] += pts;

            if (redAlsoPotted) state.reds -= 1;
            const lastRedGone = redAlsoPotted && state.reds === 0;
            // §2 Def 1(d) / §3 R4(a): with the Black the only ball left, a foul ends the frame
            const blackOnly = isBlackOnly();

            state.history.push(historyEntry);

            // A foul always ends the visit and hands the table to the opponent
            handOverTo(opponent);

            // If that red was the last one, the incoming player plays a color of their choice
            if (lastRedGone) {
                state.phase = 'last-red';
                state.colorsPotted = [false, false, false, false, false, false];
                state.colorAfterLastRed = null;
                render();
            } else if (blackOnly) {
                // §2 Def 1(d) / §3 R4(a): the foul ends the frame — unless the scores are then level
                if (state.A === state.B) {
                    startRespottedBlack(opponent);
                } else {
                    state.frameOver = true;
                    state.phase = 'over';
                }
                render();
            }
        }

        // ============================================================
        // UNDO / RESET
        // ============================================================

        function undo() {
            if (state.history.length === 0) return;
            const last = state.history.pop();
            state[last.player] = last.newTotal - last.delta;
            if (last.concede) {
                state.framesA = last.framesABefore;
                state.framesB = last.framesBBefore;
                state.frameAwarded = false;
            }
            state.reds = last.redsBefore;
            state.colorsPotted = last.colorsPottedBefore;
            state.frameOver = last.frameOverBefore;
            state.redPottedThisVisit = last.redPottedThisVisitBefore;
            state.phase = last.phaseBefore;
            state.colorAfterLastRed = last.colorAfterLastRedBefore;
            state.turn = last.turnBefore;
            render();
        }

        function newFrame() {
            if (state.history.length === 0 && state.A === 0 && state.B === 0 && !state.frameOver) return;

            // Award the frame to the higher score, unless it was already decided (concession)
            if (!state.frameAwarded) {
                if (state.A > state.B) state.framesA += 1;
                else if (state.B > state.A) state.framesB += 1;
            }

            // §3 R3(b): the player to play first must alternate for each frame
            resetState(state.breaker === 'A' ? 'B' : 'A');
            render();
        }

        function resetState(breaker) {
            state.breaker = (breaker === 'A' || breaker === 'B')
                ? breaker
                : (state.breaker === 'B' ? 'B' : 'A');
            state.A = 0;
            state.B = 0;
            state.history = [];
            state.turn = state.breaker;
            state.frameAwarded = false;
            state.reds = MAX_REDS;
            state.colorsPotted = [false, false, false, false, false, false];
            state.frameOver = false;
            state.redPottedThisVisit = false;
            state.phase = 'reds';
            state.colorAfterLastRed = null;
        }

        function resetMatch() {
            if (state.framesA > 0 || state.framesB > 0 || state.history.length > 0) {
                if (!confirm(t('resetMatchConfirm'))) return;
            }
            state.framesA = 0;
            state.framesB = 0;
            state.nameA = t('defaultNameA');
            state.nameB = t('defaultNameB');
            state.breaker = 'A';
            resetState('A');
            render();
        }

        // ============================================================
        // TEST FUNCTIONS
        // ============================================================

        function setup147Test() {
            resetState();
            state.reds = 1;
            state.turn = 'A';
            state.phase = 'reds';
            state.colorsPotted = [false, false, false, false, false, false];
            render();
            console.log('🧪 147 Test: One red left. Pot the last red, then any color, then colors in order.');
        }

        function setupLastRedTest() {
            resetState();
            state.reds = 1;
            state.turn = 'A';
            state.phase = 'reds';
            state.colorsPotted = [false, false, false, false, false, false];
            render();
            console.log('🧪 Last Red Test: One red left. Pot the last red, then any color.');
        }

        function quickRedBlack() {
            if (state.phase === 'reds' && state.reds > 0 && !state.redPottedThisVisit) {
                addPoints(state.turn, 1);
                if (state.redPottedThisVisit && state.phase === 'reds') {
                    addPoints(state.turn, 7);
                }
            } else {
                console.log('❌ Cannot quick red-black: phase=' + state.phase + ', reds=' + state.reds + ', redPotted=' + state.redPottedThisVisit);
            }
        }

        function quickPotBlack() {
            if (state.phase === 'last-red') {
                addPoints(state.turn, 7);
            } else if (state.phase === 'reds' && state.redPottedThisVisit) {
                addPoints(state.turn, 7);
            } else {
                console.log('❌ Cannot pot black now: phase=' + state.phase + ', redPotted=' + state.redPottedThisVisit);
            }
        }

        // ============================================================
        // NAME EDIT
        // ============================================================

        function startNameEdit(player) {
            const el = player === 'A' ? nameAEl : nameBEl;
            const currentName = player === 'A' ? state.nameA : state.nameB;
            if (el.querySelector('input')) return;

            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'player-name-input';
            input.value = currentName;
            input.placeholder = t('enterName');
            input.maxLength = 20;

            el.innerHTML = '';
            el.appendChild(input);
            input.focus();
            input.select();

            let editing = true;
            function finishEdit(save = true) {
                if (!editing) return;
                editing = false;
                const newName = input.value.trim();
                if (save && newName.length > 0) {
                    if (player === 'A') state.nameA = newName;
                    else state.nameB = newName;
                }
                // Drop the input so render() restores the plain name label
                if (input.parentNode) input.remove();
                render();
            }

            input.addEventListener('blur', () => finishEdit(true));
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') { e.preventDefault();
                    input.blur(); }
                if (e.key === 'Escape') { e.preventDefault();
                    finishEdit(false); }
            });
            input.addEventListener('click', (e) => e.stopPropagation());
        }

        // ============================================================
        // LOAD / INIT
        // ============================================================

        function loadState() {
            try {
                const saved = localStorage.getItem('snooker_state_v2');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (parsed && typeof parsed.A === 'number' && typeof parsed.B === 'number' && parsed.turn) {
                        Object.assign(state, parsed);
                        render();
                        return true;
                    }
                }
            } catch (e) {}
            return false;
        }

        // ============================================================
        // LANGUAGE
        // ============================================================

        function readStoredLanguage() {
            try {
                const saved = localStorage.getItem(LANG_KEY);
                if (saved && I18N[saved]) return saved;
            } catch (e) {}
            // Fall back to the browser language
            return (navigator.language || '').toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en';
        }

        function applyStaticText() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                el.textContent = t(el.getAttribute('data-i18n'));
            });
            document.querySelectorAll('[data-i18n-title]').forEach(el => {
                el.title = t(el.getAttribute('data-i18n-title'));
            });
            document.title = t('docTitle');
            document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
            langChips.forEach(chip => chip.classList.toggle('active', chip.getAttribute('data-lang') === lang));
        }

        function setLanguage(nextLang) {
            if (!I18N[nextLang] || nextLang === lang) return;
            lang = nextLang;
            try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
            localizeDefaultNames();
            applyStaticText();
            render();
        }

        function bindEvents() {
            // Button clicks
            document.querySelectorAll('.btn-grid .btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const player = btn.getAttribute('data-player');
                    const value = btn.getAttribute('data-value');
                    if (!player || !value) return;
                    addPoints(player, value, parseInt(btn.getAttribute('data-reds') || '1', 10));
                });
            });

            // Middle controls (they apply to the player at the table)
            shotTakenBtn.addEventListener('click', takeShot);
            foulBtn.addEventListener('click', () => showFoulDialog(state.turn));
            startABtn.addEventListener('click', () => selectStarter('A'));
            startBBtn.addEventListener('click', () => selectStarter('B'));

            // Action buttons
            undoBtn.addEventListener('click', undo);
            concedeBtn.addEventListener('click', showConcedeDialog);
            resetBtn.addEventListener('click', newFrame);
            resetMatchBtn.addEventListener('click', resetMatch);

            // Language switch
            langChips.forEach(chip => {
                chip.addEventListener('click', () => setLanguage(chip.getAttribute('data-lang')));
            });

            // Name edit
            nameAEl.addEventListener('click', () => startNameEdit('A'));
            nameBEl.addEventListener('click', () => startNameEdit('B'));

            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.key === 'u' || e.key === 'U') undo();
                if (e.key === 'n' || e.key === 'N') newFrame();
                if (e.key === 'r' || e.key === 'R') resetMatch();
                if (e.key === 's' || e.key === 'S') {
                    if (canTakeShot()) takeShot();
                }
                if (e.key === '1') setup147Test();
                if (e.key === '2') setupLastRedTest();
                if (e.key === '3') quickRedBlack();
                if (e.key === '4') quickPotBlack();
            });
        }

        function init() {
            lang = readStoredLanguage();
            const loaded = loadState();
            if (!loaded) resetState();
            localizeDefaultNames();
            applyStaticText();
            render();
            bindEvents();
            console.log('🎱 Snooker Scorer Pro loaded!');
            console.log('📋 Phase: ' + state.phase + ', Reds: ' + state.reds, '· Lang: ' + lang);
            console.log('⌨️ Shortcuts: 1=Test147, 2=TestLastRed, 3=QuickRed+Black, 4=PotBlack, S=ShotTaken');
        }

        init();
    })();
</script>
</body>
</html>
