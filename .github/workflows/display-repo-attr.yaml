# =============================================================================
# Display repository attributes - for AWS IAM role (OIDC) testing
# -----------------------------------------------------------------------------
# What it does
#   1. Prints the generic GitHub attributes of the repository and its owner
#      (organization name, organization ID, repo name, repo ID, visibility,
#      refs, actor and run metadata). These are the values you need in order to
#      write an IAM role trust policy.
#   2. Mints the Actions OIDC token and decodes its claims - exactly what AWS
#      evaluates in the trust policy: sub, aud, repository_id,
#      repository_owner_id, ref, environment, job_workflow_ref, ...
#   3. Writes a job summary with a ready-to-paste trust policy populated from
#      the real values of this run.
#   4. Optionally (workflow_dispatch -> assume_role = true) assumes the role in
#      the repository secret IAM_ROLE and then runs a generic STS check
#      (sts:GetCallerIdentity, which needs no IAM permissions) to print the AWS
#      account ID, caller ARN and caller user ID. That is the end-to-end proof
#      that the trust policy is correct, and it tells you which account ID to
#      use in the OIDC provider ARN.
#
# Secret
#   IAM_ROLE - repository-level secret holding the IAM role ARN, for example:
#   arn:aws:iam::123456789012:role/github-actions-oidc-test
#   Actions masks the value automatically in the logs.
#
# Notes
#   * id-token: write is required to request the OIDC token. It is granted per
#     job (not workflow-wide) to keep the default permissions minimal.
#   * Pull requests coming from forks cannot request an OIDC token and cannot
#     read secrets, so those runs skip those steps instead of failing.
#   * Subject (sub) claim format: repositories created on or after 2026-07-15
#     (or that opted in) use the immutable format
#       repo:OWNER@OWNER_ID/REPO@REPO_ID:ref:refs/heads/BRANCH
#     instead of the legacy name-only format repo:OWNER/REPO:ref:...
#     Trust policies must match the format the repository actually uses, or AWS
#     returns AccessDenied for sts:AssumeRoleWithWebIdentity. The trust policy
#     written to the job summary is derived from the real token, so it matches.
#   * Optional extra: workflow_dispatch -> debug_claims = true additionally runs
#     github/actions-oidc-debugger for a raw claim dump next to the interpreted
#     output of step 2. That action was archived on 2025-09-22, so it is pinned
#     to its v1.0.0 commit and marked continue-on-error. It is a Docker action
#     (image pull/build) and its audience input is required - the README example
#     passes the repo owner URL, which does NOT match an AWS trust policy.
#   * Nothing here writes to the repository; all steps are read-only.
# =============================================================================

name: Demo repo attributes

on:
  workflow_dispatch:
    inputs:
      assume_role:
        description: With the attributes printed, assume secrets.IAM_ROLE and call sts:GetCallerIdentity
        type: boolean
        default: false
      aws_region:
        description: AWS region used for the credential test
        type: string
        default: ap-southeast-2
      audience:
        description: OIDC token audience (must match the IAM trust policy aud)
        type: string
        default: sts.amazonaws.com
      debug_claims:
        description: Also run github/actions-oidc-debugger for a raw OIDC claims dump
        type: boolean
        default: false

#   push:
#     branches: [main]

  pull_request:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Read-only reporting: repository/owner attributes + OIDC claims.
  # ---------------------------------------------------------------------------
  attributes:
    name: Repository attributes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to mint the OIDC token that AWS exchanges for credentials.
      id-token: write
    steps:
      # -----------------------------------------------------------------------
      # 1. Generic context attributes (org name/ID, repo name/ID, refs, run ...)
      # -----------------------------------------------------------------------
      - name: Show GitHub context attributes
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: |
          set -euo pipefail
          CTX="$RUNNER_TEMP/github-context.json"
          printf '%s' "$GITHUB_CONTEXT" > "$CTX"

          echo "### Identity of the owner (organization or user)"
          keys=(repository_owner repository_owner_id)
          for k in "${keys[@]}"; do
            printf '  %-30s %s\n' "$k" "$(jq -r --arg k "$k" '.[$k] // "n/a"' "$CTX")"
          done

          echo
          echo "### Identity of the repository"
          keys=(repository repository_id repository_visibility)
          for k in "${keys[@]}"; do
            printf '  %-30s %s\n' "$k" "$(jq -r --arg k "$k" '.[$k] // "n/a"' "$CTX")"
          done

          echo
          echo "### Credentials / principal attributes"
          keys=(actor actor_id event_name ref ref_type ref_protected sha environment)
          for k in "${keys[@]}"; do
            printf '  %-30s %s\n' "$k" "$(jq -r --arg k "$k" '.[$k] // "n/a"' "$CTX")"
          done

          echo
          echo "### Workflow / run attributes"
          keys=(workflow workflow_ref job_workflow_ref job server_url run_id run_number run_attempt)
          for k in "${keys[@]}"; do
            printf '  %-30s %s\n' "$k" "$(jq -r --arg k "$k" '.[$k] // "n/a"' "$CTX")"
          done

          echo
          echo "### Repository details from the event payload"
          if jq -e '.event.repository' "$CTX" >/dev/null 2>&1; then
            jq -r '.event.repository
                   | { name, full_name, id, node_id, private, visibility,
                       default_branch, owner: .owner.login, owner_id: .owner.id,
                       owner_type: .owner.type, created_at }' "$CTX"
          else
            echo "  (event payload has no repository object for this event)"
          fi

          echo
          echo "### Default GITHUB_* environment variables"
          env | grep '^GITHUB_' | sort || true

      # -----------------------------------------------------------------------
      # 2. OIDC token claims - the payload AWS validates in a trust policy.
      # -----------------------------------------------------------------------
      - name: Show OIDC token claims
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          AUDIENCE: ${{ github.event.inputs.audience || 'sts.amazonaws.com' }}
        run: |
          set -euo pipefail

          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::warning::ACTIONS_ID_TOKEN_REQUEST_URL is not set - cannot request an OIDC token."
            exit 0
          fi

          echo "Requesting OIDC token with audience '$AUDIENCE' ..."
          OIDC_TOKEN="$(curl -sS -f \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}" | jq -r '.value')"

          # Decode the JWT payload (no signature verification needed - the token
          # is ours and we only want to read the claims).
          OIDC_TOKEN="$OIDC_TOKEN" python3 - <<'PY' > "$RUNNER_TEMP/oidc-claims.json"
          import base64, json, os
          payload = os.environ["OIDC_TOKEN"].split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          print(json.dumps(claims, indent=2, sort_keys=True))
          PY

          echo
          echo "### OIDC token claims"
          cat "$RUNNER_TEMP/oidc-claims.json"

          echo
          echo "### Claim -> IAM trust policy condition key"
          echo "  sub                  -> token.actions.githubusercontent.com:sub              (repo:OWNER/REPO:ref:...)"
          echo "  aud                  -> token.actions.githubusercontent.com:aud"
          echo "  repository_id        -> token.actions.githubusercontent.com:repository_id     (immutable)"
          echo "  repository_owner_id  -> token.actions.githubusercontent.com:repository_owner_id (immutable)"
          echo "  ref                  -> token.actions.githubusercontent.com:ref"
          echo "  environment          -> token.actions.githubusercontent.com:environment"
          echo "  job_workflow_ref     -> token.actions.githubusercontent.com:job_workflow_ref"

          # ----------------------------------------------------------------
          # The sub claim is what a trust policy matches on, and its format
          # changed: legacy = repo:OWNER/REPO:... , immutable = repo:OWNER@ID/REPO@ID:...
          # ----------------------------------------------------------------
          sub="$(jq -r '.sub' "$RUNNER_TEMP/oidc-claims.json")"

          echo
          echo "### Subject (sub) claim - use this exact format in the trust policy"
          echo "  sub claim        : $sub"

          case "$sub" in
            repo:*)
              repo_segment="${sub#*:}"
              repo_segment="${repo_segment%%:*}"
              echo "  repo segment     : $repo_segment"
              echo "  StringLike value : repo:${repo_segment}:*"

              case "$repo_segment" in
                *@*)
                  echo "  format           : IMMUTABLE (owner ID and repo ID included)"
                  echo "::warning::Immutable sub format detected. A trust policy condition of 'repo:$GITHUB_REPOSITORY:*' will NEVER match and AWS will return AccessDenied."
                  echo "           Use: repo:${repo_segment}:*"
                  ;;
                *)
                  echo "  format           : LEGACY name-only"
                  ;;
              esac
              ;;
            *)
              # An organization or repository sub-claim template is configured, so
              # the claim is not the default repo:... shape.
              echo "  format           : custom sub-claim template (org/repo OIDC customization)"
              echo "  StringEquals     : $sub"
              ;;
          esac

      # -----------------------------------------------------------------------
      # 2b. Optional raw claims dump via github/actions-oidc-debugger.
      #     Enable with workflow_dispatch -> debug_claims = true.
      #     This is the one third-party dependency in the workflow: the action was
      #     archived on 2025-09-22 (read-only), so it is pinned to the commit of
      #     its v1.0.0 tag and continue-on-error keeps it from breaking the run.
      #     It is a Docker action, so expect an image pull/build on each run, and
      #     its required `audience` input has to match the IAM trust policy.
      #     The input only exists for workflow_dispatch, so every other event
      #     (including fork pull requests) skips this step.
      # -----------------------------------------------------------------------
      - name: Show OIDC claims (github/actions-oidc-debugger) - optional
        if: github.event.inputs.debug_claims == 'true'
        continue-on-error: true
        uses: github/actions-oidc-debugger@9649f894cd935032350792327ca5354e88e662e3 # v1.0.0
        with:
          audience: ${{ github.event.inputs.audience || 'sts.amazonaws.com' }}

      # -----------------------------------------------------------------------
      # 3. Job summary with a ready-to-paste trust policy.
      # -----------------------------------------------------------------------
      - name: Write job summary
        if: always()
        run: |
          set -euo pipefail
          CTX="$RUNNER_TEMP/github-context.json"
          attr() { jq -r --arg k "$1" '.[$k] // "n/a"' "$CTX"; }

          org="$(attr repository_owner)"
          org_id="$(attr repository_owner_id)"
          repo="$(attr repository)"
          repo_id="$(attr repository_id)"
          visibility="$(attr repository_visibility)"
          branch="${GITHUB_REF_NAME:-unknown}"

          # --- Subject (sub) claim: the value an IAM trust policy must match ---
          #   legacy    : repo:OWNER/REPO:ref:refs/heads/BRANCH
          #   immutable : repo:OWNER@OWNER_ID/REPO@REPO_ID:ref:refs/heads/BRANCH
          # Repositories created on or after 2026-07-15 use the immutable format.
          # Deriving the pattern from the real token keeps this correct either way.
          CLAIMS="$RUNNER_TEMP/oidc-claims.json"
          if [ -f "$CLAIMS" ] && [ "$(jq -r '.sub // empty' "$CLAIMS")" != "" ]; then
            sub_claim="$(jq -r '.sub' "$CLAIMS")"
            sub_source="OIDC token"
          else
            sub_claim="repo:${repo}:ref:refs/heads/${branch}"
            sub_source="repository name (fallback - token not collected)"
          fi

          case "$sub_claim" in
            repo:*)
              repo_segment="${sub_claim#*:}"   # drop the leading "repo:"
              repo_segment="${repo_segment%%:*}" # drop ":<context>[:<value>]"
              sub_wildcard="repo:${repo_segment}:*"
              sub_pinned="repo:${repo_segment}:ref:refs/heads/${branch}"
              case "$repo_segment" in
                *@*) sub_format="immutable (owner ID / repo ID included)"; sub_immutable="yes";;
                *)   sub_format="legacy name-only"; sub_immutable="no";;
              esac
              ;;
            *)
              # Custom sub-claim template: there is no repo:... prefix to derive
              # from, so the raw claim has to be matched exactly.
              sub_wildcard="not applicable - match the raw sub exactly"
              sub_pinned="$sub_claim"
              sub_format="custom sub-claim template"
              sub_immutable="no"
              ;;
          esac

          if [ "$sub_source" != "OIDC token" ]; then
            sub_format="assumed - token not collected, verify against the real token"
            sub_immutable="unknown"
          fi

          {
            echo "## Repository attributes for IAM role testing"
            echo
            echo "| Attribute | Context / OIDC claim | Value |"
            echo "| --- | --- | --- |"
            echo "| Organization (owner) name | \`repository_owner\` | \`$org\` |"
            echo "| Organization (owner) ID | \`repository_owner_id\` | \`$org_id\` |"
            echo "| Repository full name | \`repository\` | \`$repo\` |"
            echo "| Repository ID | \`repository_id\` | \`$repo_id\` |"
            echo "| Repository visibility | \`repository_visibility\` | \`$visibility\` |"
            echo "| Ref | \`ref\` | \`${GITHUB_REF:-n/a}\` |"
            echo "| Ref name | - | \`$branch\` |"
            echo "| Ref type | \`ref_type\` | \`${GITHUB_REF_TYPE:-n/a}\` |"
            echo "| Environment | \`environment\` | \`${GITHUB_ENVIRONMENT:-none}\` |"
            echo "| Actor | \`actor\` | \`${GITHUB_ACTOR:-n/a}\` |"
            echo "| Actor ID | \`actor_id\` | \`${GITHUB_ACTOR_ID:-n/a}\` |"
            echo "| Event | \`event_name\` | \`${GITHUB_EVENT_NAME:-n/a}\` |"
            echo "| Workflow | \`workflow\` | \`${GITHUB_WORKFLOW:-n/a}\` |"
            echo "| Run ID / number | \`run_id\` / \`run_number\` | \`${GITHUB_RUN_ID:-n/a}\` / \`${GITHUB_RUN_NUMBER:-n/a}\` |"
            echo "| IAM_ROLE secret | - | ${{ secrets.IAM_ROLE != '' && 'configured (value masked)' || 'not set' }} |"
            echo
            echo "> \`repository_id\` and \`repository_owner_id\` are immutable, so they are safer"
            echo "> trust-policy conditions than names. The \`sub\` claim is the primary condition."
            echo
            echo "### Subject (\`sub\`) claim - what the trust policy must match"
            echo
            echo "| Item | Value |"
            echo "| --- | --- |"
            printf '| `sub` claim (from %s) | `%s` |\n' "$sub_source" "$sub_claim"
            printf '| Format | %s |\n' "$sub_format"
            printf '| `StringLike` pattern (any ref) | `%s` |\n' "$sub_wildcard"
            printf '| `StringEquals` value (this ref only) | `%s` |\n' "$sub_pinned"
            echo
            if [ "$sub_immutable" = "yes" ]; then
              echo "> **AccessDenied gotcha:** this repository uses the immutable subject format,"
              echo "> so a condition written as \`repo:${repo}:*\` can never match the token and"
              echo "> AWS answers \`Not authorized to perform sts:AssumeRoleWithWebIdentity\`."
              echo "> Use the pattern in the table above, including the \`@\` IDs."
              echo
            fi
            echo "### Sample IAM role trust policy (generated from this run)"
            echo
            echo '```json'
            cat <<JSON
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Principal": {
                  "Federated": "arn:aws:iam::<AWS_ACCOUNT_ID>:oidc-provider/token.actions.githubusercontent.com"
                },
                "Action": "sts:AssumeRoleWithWebIdentity",
                "Condition": {
                  "StringEquals": {
                    "token.actions.githubusercontent.com:aud": "sts.amazonaws.com",
                    "token.actions.githubusercontent.com:repository_id": "$repo_id",
                    "token.actions.githubusercontent.com:repository_owner_id": "$org_id"
                  },
                  "StringLike": {
                    "token.actions.githubusercontent.com:sub": "$sub_wildcard"
                  }
                }
              }
            ]
          }
          JSON
            echo '```'
            echo
            echo "Strictest variant - pin the exact subject claim of this run:"
            echo
            echo '```json'
            echo '{'
            echo '  "StringEquals": {'
            echo '    "token.actions.githubusercontent.com:aud": "sts.amazonaws.com",'
            printf '    "token.actions.githubusercontent.com:sub": "%s"\n' "$sub_pinned"
            echo '  }'
            echo '}'
            echo '```'
            echo
            if [ -f "$RUNNER_TEMP/oidc-claims.json" ]; then
              echo "### OIDC token claims (as presented to AWS)"
              echo
              echo "| Claim | Value |"
              echo "| --- | --- |"
              jq -r 'to_entries | sort_by(.key)[] | "| `\(.key)` | `\(.value)` |"' "$RUNNER_TEMP/oidc-claims.json"
            else
              echo "_OIDC claims were not collected for this event (fork pull request or missing id-token permission)._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # -----------------------------------------------------------------------
      # 4. Confirm the repository secret is available to the workflow.
      # -----------------------------------------------------------------------
      - name: Check IAM_ROLE secret
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          IAM_ROLE: ${{ secrets.IAM_ROLE }}
        run: |
          set -euo pipefail

          if [ -z "${IAM_ROLE:-}" ]; then
            echo "::error::Repository secret IAM_ROLE is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

          echo "::add-mask::$IAM_ROLE"
          echo "IAM_ROLE is configured (Actions masks the value in the log as ***)."
          echo "  value (masked)        : $IAM_ROLE"
          echo "  length                : ${#IAM_ROLE} characters"

          case "$IAM_ROLE" in
            arn:*:iam::*:role/*) echo "  format                : looks like an IAM role ARN";;
            *) echo "::warning::IAM_ROLE does not look like an IAM role ARN (expected arn:<partition>:iam::<account-id>:role/<name>)";;
          esac

  # ---------------------------------------------------------------------------
  # Optional end-to-end test: exchange the OIDC token for temporary credentials,
  # then use them for a generic STS call to report the AWS account ID.
  # Enable with workflow_dispatch -> assume_role = true.
  # ---------------------------------------------------------------------------
  assume-role:
    name: Assume IAM role and STS identity test
    needs: attributes
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.assume_role == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure AWS credentials from GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.IAM_ROLE }}
          aws-region: ${{ github.event.inputs.aws_region }}
          audience: ${{ github.event.inputs.audience }}
          role-session-name: gh-oidc-test-${{ github.run_id }}
          # Show the real account ID in the output - that is part of the test.
          # Set to true if the account ID must be masked in the logs.
          mask-aws-account-id: false

      - name: Generic STS check - get account ID and caller identity
        run: |
          set -euo pipefail

          echo "### aws sts get-caller-identity (raw output)"
          aws sts get-caller-identity

          # The same call, reduced to the fields an IAM test cares about.
          # sts:GetCallerIdentity requires no IAM permissions, so it is a safe,
          # generic way to prove the credentials work and to read the account ID.
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          caller_arn="$(aws sts get-caller-identity --query Arn --output text)"
          user_id="$(aws sts get-caller-identity --query UserId --output text)"
          region="${AWS_REGION:-${AWS_DEFAULT_REGION:-unknown}}"

          echo
          echo "  AWS account ID : $account_id"
          echo "  Caller ARN     : $caller_arn"
          echo "  Caller user ID : $user_id"
          echo "  Region         : $region"

          {
            echo "## AWS identity reported by STS"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            printf '| AWS account ID | `%s` |\n' "$account_id"
            printf '| Caller ARN | `%s` |\n' "$caller_arn"
            printf '| Caller user ID | `%s` |\n' "$user_id"
            printf '| Region | `%s` |\n' "$region"
            echo
            echo "OIDC provider ARN for this account - use it as the \`Principal.Federated\` value:"
            echo
            echo '```'
            echo "arn:aws:iam::$account_id:oidc-provider/token.actions.githubusercontent.com"
            echo '```'
            echo
            echo "Success: \`secrets.IAM_ROLE\` was assumed through GitHub OIDC, so the"
            echo "trust policy already accepts this repository."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: If the assume call was denied, check these
        if: failure()
        run: |
          cat <<'EOF'
          The OIDC exchange failed. Work through this list in order - the
          ``Repository attributes`` job summary has the exact values to compare against.

          1. Subject format (most common). sts:AssumeRoleWithWebIdentity returns
             AccessDenied - "Not authorized to perform sts:AssumeRoleWithWebIdentity"
             when the trust policy condition does not match the token.
               * Immutable format (repos created on/after 2026-07-15, or opted in):
                   repo:OWNER@OWNER_ID/REPO@REPO_ID:ref:refs/heads/BRANCH
               * Legacy format:
                   repo:OWNER/REPO:ref:refs/heads/BRANCH
             A condition of `repo:OWNER/REPO:*` cannot match the immutable format.
             Copy the StringLike pattern from the job summary instead.
          2. Audience. The trust policy `aud` must equal the value requested above
             (default sts.amazonaws.com), and the OIDC provider's client ID list
             must contain that audience.
          3. Role ARN. secrets.IAM_ROLE must be the role in this account whose
             trust policy you edited, and its Federated principal must be
             arn:aws:iam::<account-id>:oidc-provider/token.actions.githubusercontent.com.
          4. IAM propagation. Trust policy edits can take a few seconds to apply;
             re-run the workflow once before deeper debugging.
          5. CloudTrail. Look up AssumeRoleWithWebIdentity in the region used above
             for the recorded errorCode and the resolved principalId, which shows
             the exact `aud` and `sub` AWS matched against.
          EOF
